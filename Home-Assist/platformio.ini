; Profils de compilation (choix dans la barre du bas de VS Code, ou pio run -e <profil>) :
;   cyd-principal      : contrôleur principal (__LOCAL_MODE__ : CC1101, thermomètre local, ACK des flotteurs…)
;   cyd-aux            : CYD auxiliaire (CYD Aux, CYD Aux 2 : même firmware ; nom et préfixe des topics
;                        « configaux/ », « configaux2/ » réglés sur leur page Web, gardés en NVS)
;   principal-sans-cyd : contrôleur principal sans écran (__LOCAL_MODE__ sans __CYD__)
; Les autres commutateurs restent dans src/global.h.
[platformio]
default_envs = cyd-principal

[env]
; Version fixée (Arduino 2.0.17, comme Capteur) : « espressif32 » sans version désigne pioarduino (Arduino 3.3.x)
; installé pour Relais-Lora, dont WebServer.h ne compile pas avec TFT_eSPI (FS_NO_GLOBALS : 'FS' was not declared)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
extra_scripts = pre:version_build.py ; Date et heure de compilation toujours à jour (MyVersion.cpp)

; Vitesse de communication Serial
monitor_speed = 115200

; Bibliothèques nécessaires
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    ;https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git ========== copiée en local (lib/) : v2.5.7 avec spi renommé bSpi (conflit avec TFT_eSPI) ; la 3.0.x bloque dans Init()
    knolleary/PubSubClient@^2.8 ; MQTT
    sui77/rc-switch@^2.6.3
    ;paulstoffregen/OneWire@^2.3.8 ======================================================= copiée en local et corrigée
    milesburton/DallasTemperature@^3.11.0
    https://github.com/RobTillaart/DHT20.git ; thermomètre local si __LOCAL_DS18B20__ est commenté
    
; Configuration TFT_eSPI pour CYD (Cheap Yellow Display)
build_flags = 
    -std=gnu++14 ; warnings pour les callback
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DMQTT_MAX_PACKET_SIZE=1024
    ;-Wformat                       ; contrôle de format
    ;-Wformat-security              ; contrôle de format

[env:cyd-principal]

[env:cyd-aux]
build_flags =
    ${env.build_flags}
    -DCYD_AUXILIAIRE

[env:principal-sans-cyd]
build_flags =
    ${env.build_flags}
    -DSANS_CYD
