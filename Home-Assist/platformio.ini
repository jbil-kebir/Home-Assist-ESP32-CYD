; Profils de compilation (choix dans la barre du bas de VS Code, ou pio run -e <profil>) :
;   cyd-principal      : contrôleur principal (__LOCAL_MODE__ : CC1101, thermomètre local, ACK des flotteurs…)
;   cyd-aux            : CYD auxiliaire (CYD Aux, CYD Aux 2 : même firmware ; nom et préfixe des topics
;                        « configaux/ », « configaux2/ » réglés sur leur page Web, gardés en NVS)
;   principal-sans-cyd : contrôleur principal sans écran (__LOCAL_MODE__ sans __CYD__)
; Les autres commutateurs restent dans src/global.h.
[platformio]
default_envs = cyd-principal

[env]
; Version fixée (Arduino 2.0.17, comme Capteur) : « espressif32 » sans version désigne pioarduino (Arduino 3.3.x)
; installé pour Relais-Lora, dont WebServer.h ne compile pas avec TFT_eSPI (FS_NO_GLOBALS : 'FS' was not declared)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
extra_scripts = pre:version_build.py ; Date et heure de compilation toujours à jour (MyVersion.cpp)
; Découpage de la flash (Home-Assist 4.3) : deux emplacements de programme de 1,9 Mo (au lieu de 1,25 Mo) pour la mise à
; jour à distance ; zone de fichiers réduite à 128 Ko (inutilisée), NVS (réglages) au même endroit. Changer de
; découpage demande un flash par USB.
board_build.partitions = min_spiffs.csv

; Vitesse de communication Serial
monitor_speed = 115200
; Ne pas piloter DTR/RTS à l'ouverture du moniteur : sinon l'ESP32 reste
; bloqué en reset (écran éteint) sur le CH340 du CYD
monitor_dtr = 0
monitor_rts = 0

; Bibliothèques nécessaires
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    ;https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git ========== copiée en local (lib/) : v2.5.7 avec spi renommé bSpi (conflit avec TFT_eSPI) ; la 3.0.x bloque dans Init()
    knolleary/PubSubClient@^2.8 ; MQTT
    sui77/rc-switch@^2.6.3
    ;paulstoffregen/OneWire@^2.3.8 ======================================================= copiée en local et corrigée
    milesburton/DallasTemperature@^3.11.0
    https://github.com/RobTillaart/DHT20.git ; thermomètre local si __LOCAL_DS18B20__ est commenté
    
; Configuration TFT_eSPI pour CYD (Cheap Yellow Display)
build_flags = 
    -std=gnu++14 ; warnings pour les callback
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DMQTT_MAX_PACKET_SIZE=1024
    ;-Wformat                       ; contrôle de format
    ;-Wformat-security              ; contrôle de format

[env:cyd-principal]

; Téléversement par le réseau du CYD principal (mise à jour à distance, Home-Assist 4.3). Mot de passe lu dans
; src/secret.h (OTA_MOT_DE_PASSE) par ota_auth.py ; pas de upload_protocol (voir ota_auth.py). CYD auxiliaires : page
; http://<IP>/update, ou ce profil avec --upload-port <IP> (attention : profil principal, étiquette CYD-principal).
[env:cyd-principal-ota]
upload_port = 192.168.1.94
extra_scripts =
    pre:version_build.py
    post:ota_auth.py

; Idem pour les CYD auxiliaires (Home-Assist 4.4 : un profil par CYD, flèche « Upload » de VS Code) :
;   cyd-aux-ota  : « CYD AUX »   192.168.1.119
;   cyd-aux2-ota : « CYD AUX 2 » 192.168.1.126 (IP relevée dans les trames du 16/11/2026, à vérifier)
; Autre CYD auxiliaire : pio run -e cyd-aux-ota -t upload --upload-port <IP>
[env:cyd-aux-ota]
upload_port = 192.168.1.119
build_flags =
    ${env.build_flags}
    -DCYD_AUXILIAIRE
extra_scripts =
    pre:version_build.py
    post:ota_auth.py

[env:cyd-aux2-ota]
upload_port = 192.168.1.126
build_flags =
    ${env.build_flags}
    -DCYD_AUXILIAIRE
extra_scripts =
    pre:version_build.py
    post:ota_auth.py

[env:cyd-aux]
build_flags =
    ${env.build_flags}
    -DCYD_AUXILIAIRE

[env:principal-sans-cyd]
build_flags =
    ${env.build_flags}
    -DSANS_CYD
