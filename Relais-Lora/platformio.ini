; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
; Vitesse de communication Serial
monitor_speed = 115200

; Bibliothèques nécessaires
lib_deps = 
    knolleary/PubSubClient@^2.8 ; MQTT
    ;paulstoffregen/OneWire@^2.3.8 ======================================================= copiée en local et corrigée
    https://github.com/jgromes/RadioLib

build_flags = 
; Deux lignes à commenter/décommmenter pour avoir le moniteur série pour les affichages
;============================ DEBUG ============================================================
	-D ARDUINO_USB_MODE=1 ; Debug : active le mode USB pour avoir un port série et un périphérique USB (ex: clavier, souris, etc.) dès le démarrage            
	-D ARDUINO_USB_CDC_ON_BOOT=1 ; Debug : active le port série USB dès le démarrage pour voir les logs de démarrage     
;============================ PRODUCTION =======================================================
	;-D ARDUINO_USB_MODE=0 ; Production : désactive le mode USB pour économiser de l'énergie (pas de port série, pas de périphérique USB)            
	;-D ARDUINO_USB_CDC_ON_BOOT=0  ; Production : désactive le port série USB pour économiser de l'énergie 
