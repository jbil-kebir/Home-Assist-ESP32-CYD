; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Dossier PlatformIO propre au relais (plateformes et paquets) : le relais (pioarduino, Arduino 3.x / IDF 5) et le
; Capteur (espressif32@6.9.0, Arduino 2.x / IDF 4.4) partageaient ~/.platformio/packages et se gênaient
; (1re compilation du relais après le Capteur en échec : TypeError NoneType). 1re compilation : téléchargement complet.
[platformio]
core_dir = ${sysenv.USERPROFILE}/.platformio-relais

[env:seeed_xiao_esp32s3]
; Version fixée (pioarduino 55.03.311 = Arduino 3.3.11, IDF 5.5), celle du relais 2.6 testé le 16/11/2026 ;
; avant, « espressif32 » sans version prenait la plateforme installée sous ce nom
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
extra_scripts = pre:version_build.py ; Date et heure de compilation toujours à jour (MyVersion.cpp)
; Vitesse de communication Serial
monitor_speed = 115200

; Bibliothèques nécessaires
lib_deps = 
    knolleary/PubSubClient@^2.8 ; MQTT
    ;paulstoffregen/OneWire@^2.3.8 ======================================================= copiée en local et corrigée
    jgromes/RadioLib@7.6.0 ; version fixée : la 8.0 (dépôt GitHub sans version) change l API, SX1262::begin et setPacketSentAction ne compilent plus (15/11/2026)

build_flags = 
; Deux lignes à commenter/décommmenter pour avoir le moniteur série pour les affichages
;============================ DEBUG ============================================================
	-D ARDUINO_USB_MODE=1 ; Debug : active le mode USB pour avoir un port série et un périphérique USB (ex: clavier, souris, etc.) dès le démarrage            
	-D ARDUINO_USB_CDC_ON_BOOT=1 ; Debug : active le port série USB dès le démarrage pour voir les logs de démarrage     
;============================ PRODUCTION =======================================================
	;-D ARDUINO_USB_MODE=0 ; Production : désactive le mode USB pour économiser de l'énergie (pas de port série, pas de périphérique USB)            
	;-D ARDUINO_USB_CDC_ON_BOOT=0  ; Production : désactive le port série USB pour économiser de l'énergie 
