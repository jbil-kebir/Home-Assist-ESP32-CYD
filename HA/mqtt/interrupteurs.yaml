# Interrupteurs MQTT (actionneurs commandés par le CYD), inclus par configuration.yaml (mqtt: switch:)
# Liste YAML : chaque élément = un interrupteur. Découpé de configuration.yaml le 20/11/2026.

- name: "Projecteur"
  unique_id: mqtt_projecteur
  command_topic: "home/projecteur/command"
  state_topic: "home/projecteur/command"
  payload_on: "ON"
  payload_off: "OFF"
  state_on: "ONR"
  state_off: "OFFR"
  icon: mdi:projector

