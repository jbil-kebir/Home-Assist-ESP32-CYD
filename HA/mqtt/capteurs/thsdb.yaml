    - topic: "home/alerte/CoulSdb"
      value_template: "{{ 'online' if value.startswith('OK') else 'offline' }}"
  value_template: >
    {% set parts = value.split(' ') %}
    {% if parts[0]|upper == 'COULSDB' and parts[1]|upper == 'DEL' %}
      {% if parts[4] == '0' %}Eteinte{% else %}Allumee{% endif %}
    {% else %}
      {{ 'None' if states('sensor.coulsdb_del') in ['unavailable', 'unknown'] else states('sensor.coulsdb_del') }}
    {% endif %}


