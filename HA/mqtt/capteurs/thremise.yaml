- name: "Flotteur Remise"
  unique_id: flotteurremise_onoff
  state_topic: "home/thermometre/state"
  # Indisponible tant que le CYD signale le capteur en retard (home/alerte/<capteur> : OK / RETARD, retenu)
  availability:
    - topic: "home/alerte/FlotteurRemise"
      value_template: "{{ 'online' if value.startswith('OK') else 'offline' }}"
  value_template: >
    {% set parts = value.split(' ') %}
    {% if parts[0]|upper == 'FLOTTEURREMISE' and parts[1]|upper == 'ONOFF' %}
      {% if parts[4] | float > 0 %}Cuve vide{% else %}Cuve pleine{% endif %}
    {% else %}
      {{ 'None' if states('sensor.flotteur_remise') in ['unavailable', 'unknown'] else states('sensor.flotteur_remise') }}
    {% endif %}
