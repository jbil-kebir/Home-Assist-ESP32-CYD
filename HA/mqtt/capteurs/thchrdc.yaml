  value_template: >
    {% set parts = value.split(' ') %}
    {% if parts[0]|upper == 'BATCHRDC' and parts[1]|upper == 'TENSION' %}
      {{ parts[2] | capitalize }}
    {% else %}
      {{ 'None' if states('sensor.batchrdc_etat') in ['unavailable', 'unknown'] else states('sensor.batchrdc_etat') }}
