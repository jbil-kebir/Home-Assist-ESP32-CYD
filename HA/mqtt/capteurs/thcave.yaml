# Capteurs MQTT du nœud ThCave (ThCave, BatCave, JnCave)
# Inclus par configuration.yaml (mqtt: sensor: !include_dir_merge_list mqtt/capteurs/) :
# liste YAML, chaque élément = un capteur. Découpé de configuration.yaml le 20/11/2026.


- name: "ThCave Temperature"
  unique_id: thcave_temp
  state_topic: "home/thermometre/state"
  # Indisponible tant que le CYD signale le capteur en retard (home/alerte/<capteur> : OK / RETARD, retenu)
  availability:
    - topic: "home/alerte/ThCave"
      value_template: "{{ 'online' if value.startswith('OK') else 'offline' }}"
  unit_of_measurement: "°C"
  device_class: temperature
  value_template: >
    {% set parts = value.split(' ') %}
    {% if parts[0]|upper == 'THCAVE' and parts[1]|upper == 'TEMP' %}
      {{ parts[4] }}
    {% else %}
      {{ 'None' if states('sensor.thcave_temperature') in ['unavailable', 'unknown'] else states('sensor.thcave_temperature') }}
    {% endif %}


