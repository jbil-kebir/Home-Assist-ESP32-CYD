# Détecteur jour / nuit de ThCave (classe CJourNuit du Capteur) :
#   « JnCave Jour <date> <heure> 1|0 [FORCE] [IP] » et « JnCave Eclairement <date> <heure> <pct> [FORCE] [IP] »
- name: "JnCave Etat"
  unique_id: jncave_etat
  state_topic: "home/thermometre/state"
  # Indisponible tant que le CYD signale le capteur en retard (home/alerte/<capteur> : OK / RETARD, retenu)
  availability:
    - topic: "home/alerte/JnCave"
      value_template: "{{ 'online' if value.startswith('OK') else 'offline' }}"
  icon: mdi:theme-light-dark
  value_template: >
    {% set parts = value.split(' ') %}
    {% if parts[0]|upper == 'JNCAVE' and parts[1]|upper == 'JOUR' %}
      {{ 'Jour' if parts[4] == '1' else 'Nuit' }}
    {% else %}
      {{ 'None' if states('sensor.jncave_etat') in ['unavailable', 'unknown'] else states('sensor.jncave_etat') }}
    {% endif %}


