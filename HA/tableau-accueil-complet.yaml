# Tableau « Accueil » COMPLET (6 vues) : export .storage/lovelace.dashboard_accueil du 12/11/2026
# + vue Actionneurs de vue-actionneurs.yaml (carte Chauffage RdC, couleur de Lumière cave selon sensor.jncave_etat).
# Installation : tableau Accueil → ✏️ → ⋮ → « Éditeur de configuration brute » → tout remplacer par ce fichier.
views:
- type: sections
  max_columns: 4
  title: Accueil
  path: accueil
  icon: mdi:home-account
  sections:
  - type: grid
    cards:
    - show_current: true
      show_forecast: true
      type: weather-forecast
      entity: weather.meteo_france_forecast_for_city_bischwiller_alsace_67_fr_bischwiller
      forecast_type: hourly
    - type: horizontal-stack
      cards:
      - type: custom:mini-graph-card
        name: Températures inérieures
        font_size: 60
        entities:
        - entity: sensor.thchrdc_temperature
          name: RDC
          color: orange
          show_state: true
        - entity: sensor.thch1er_temperature
          name: 1er
          color: blue
          y_axis: secondary
          show_state: true
        - entity: sensor.thsdb_temperature
          name: Sdb
          color: red
          y_axis: secondary
          show_state: true
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        show:
          labels: true
          points: false
      - type: custom:mini-graph-card
        name: Températures extérieures
        font_size: 60
        entities:
        - entity: sensor.thcave_temperature
          name: Cave
          color: green
          y_axis: secondary
          show_state: true
        - entity: sensor.thremise_temperature
          name: Remise
          color: yellow
          y_axis: secondary
          show_state: true
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        show:
          labels: true
          points: false
    - type: heading
      icon: mdi:alert-outline
      heading_style: title
      heading: Alertes
    - type: vertical-stack
      cards:
      - type: horizontal-stack
        cards:
        - type: custom:mushroom-entity-card
          entity: sensor.coulsdb_del
          name: Chaudiere
          icon: mdi:fire
          card_mod:
            style: |
              ha-state-icon {
                color: {{ 'green' if states('sensor.coulsdb_del') == 'Allumee' else 'red' }} !important;
              }
              .shape {
                background: none !important;
              }
        - type: custom:mushroom-entity-card
          entity: sensor.flotteur_remise
          name: Cuve
          icon: mdi:water-circle
          icon_color: none
          card_mod:
            style: |
              ha-state-icon {
                color: {{ 'green' if states('sensor.flotteur_remise') == 'Cuve vide' else 'red' }} !important;
              }
              .shape {
                background: none !important;
              }
        - type: custom:mushroom-template-card
          entity: sensor.jncave_etat
          primary: Lumière cave
          secondary: '{{ ''Allumée'' if is_state(''sensor.jncave_etat'', ''Jour'') else (''Éteinte'' if is_state(''sensor.jncave_etat'', ''Nuit'') else ''Inconnu'') }}'
          icon: mdi:lightbulb
          tap_action:
            action: more-info
          card_mod:
            style: |
              ha-state-icon {
                color: {{ 'gold' if is_state('sensor.jncave_etat', 'Jour') else ('navy' if is_state('sensor.jncave_etat', 'Nuit') else 'grey') }} !important;
              }
              .shape {
                background: none !important;
              }
    - type: horizontal-stack
      cards:
      - type: markdown
        content: |
          {% if states('sensor.newnas_sante') == 'ok' %} 🟢 **NewNas : Santé OK** {% else %} 🔴 **NewNas : Problème détecté !** {% endif %}
        card_mod:
          style: "ha-markdown {\n  text-align: center;\n  padding: 8px;\n  color: {{ 'green' if states('sensor.newnas_sante') == 'ok' else 'red' }} !important;\n}  \n"
      - type: markdown
        content: |
          {% if states('sensor.bignas_sante') == 'ok' %} 🟢 **BigNas : Santé OK** {% else %} 🔴 **BigNas : Problème détecté !** {% endif %}
        card_mod:
          style: "ha-markdown {\n  text-align: center;\n  padding: 8px;\n  color: {{ 'green' if states('sensor.bignas_sante') == 'ok' else 'red' }} !important;\n}  \n"
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: template
        entity: binary_sensor.thremise_eveille
        icon: mdi:circle-medium
        icon_color: '{{ ''green'' if is_state(''binary_sensor.thremise_eveille'', ''on'') else (''red'' if is_state(''binary_sensor.thremise_eveille'', ''off'') else ''grey'') }}'
        content: ThRemise
        tap_action:
          action: navigate
          navigation_path: /dashboard-systeme/noeuds-capteurs
        card_mod:
          style: |
            ha-card {
              --chip-background: {{ 'rgba(76,175,80,0.2)' if is_state('binary_sensor.thremise_eveille', 'on') else ('rgba(229,115,115,0.2)' if is_state('binary_sensor.thremise_eveille', 'off') else 'rgba(158,158,158,0.2)') }};
              --primary-text-color: {{ '#4caf50' if is_state('binary_sensor.thremise_eveille', 'on') else ('#e57373' if is_state('binary_sensor.thremise_eveille', 'off') else '#9e9e9e') }};
            }
      - type: template
        entity: binary_sensor.thcave_eveille
        icon: mdi:circle-medium
        icon_color: '{{ ''green'' if is_state(''binary_sensor.thcave_eveille'', ''on'') else (''red'' if is_state(''binary_sensor.thcave_eveille'', ''off'') else ''grey'') }}'
        content: ThCave
        tap_action:
          action: navigate
          navigation_path: /dashboard-systeme/noeuds-capteurs
        card_mod:
          style: |
            ha-card {
              --chip-background: {{ 'rgba(76,175,80,0.2)' if is_state('binary_sensor.thcave_eveille', 'on') else ('rgba(229,115,115,0.2)' if is_state('binary_sensor.thcave_eveille', 'off') else 'rgba(158,158,158,0.2)') }};
              --primary-text-color: {{ '#4caf50' if is_state('binary_sensor.thcave_eveille', 'on') else ('#e57373' if is_state('binary_sensor.thcave_eveille', 'off') else '#9e9e9e') }};
            }
      - type: template
        entity: binary_sensor.thchrdc_eveille
        icon: mdi:circle-medium
        icon_color: '{{ ''green'' if is_state(''binary_sensor.thchrdc_eveille'', ''on'') else (''red'' if is_state(''binary_sensor.thchrdc_eveille'', ''off'') else ''grey'') }}'
        content: ThChRDC
        tap_action:
          action: navigate
          navigation_path: /dashboard-systeme/noeuds-capteurs
        card_mod:
          style: |
            ha-card {
              --chip-background: {{ 'rgba(76,175,80,0.2)' if is_state('binary_sensor.thchrdc_eveille', 'on') else ('rgba(229,115,115,0.2)' if is_state('binary_sensor.thchrdc_eveille', 'off') else 'rgba(158,158,158,0.2)') }};
              --primary-text-color: {{ '#4caf50' if is_state('binary_sensor.thchrdc_eveille', 'on') else ('#e57373' if is_state('binary_sensor.thchrdc_eveille', 'off') else '#9e9e9e') }};
            }
      - type: template
        entity: binary_sensor.thch1er_eveille
        icon: mdi:circle-medium
        icon_color: '{{ ''green'' if is_state(''binary_sensor.thch1er_eveille'', ''on'') else (''red'' if is_state(''binary_sensor.thch1er_eveille'', ''off'') else ''grey'') }}'
        content: ThCh1er
        tap_action:
          action: navigate
          navigation_path: /dashboard-systeme/noeuds-capteurs
        card_mod:
          style: |
            ha-card {
              --chip-background: {{ 'rgba(76,175,80,0.2)' if is_state('binary_sensor.thch1er_eveille', 'on') else ('rgba(229,115,115,0.2)' if is_state('binary_sensor.thch1er_eveille', 'off') else 'rgba(158,158,158,0.2)') }};
              --primary-text-color: {{ '#4caf50' if is_state('binary_sensor.thch1er_eveille', 'on') else ('#e57373' if is_state('binary_sensor.thch1er_eveille', 'off') else '#9e9e9e') }};
            }
      - type: template
        entity: binary_sensor.thsdb_eveille
        icon: mdi:circle-medium
        icon_color: '{{ ''green'' if is_state(''binary_sensor.thsdb_eveille'', ''on'') else (''red'' if is_state(''binary_sensor.thsdb_eveille'', ''off'') else ''grey'') }}'
        content: ThSdb
        tap_action:
          action: navigate
          navigation_path: /dashboard-systeme/noeuds-capteurs
        card_mod:
          style: |
            ha-card {
              --chip-background: {{ 'rgba(76,175,80,0.2)' if is_state('binary_sensor.thsdb_eveille', 'on') else ('rgba(229,115,115,0.2)' if is_state('binary_sensor.thsdb_eveille', 'off') else 'rgba(158,158,158,0.2)') }};
              --primary-text-color: {{ '#4caf50' if is_state('binary_sensor.thsdb_eveille', 'on') else ('#e57373' if is_state('binary_sensor.thsdb_eveille', 'off') else '#9e9e9e') }};
            }
      - type: template
        entity: binary_sensor.c3_chauffage_sdb
        icon: mdi:radiator
        icon_color: '{{ ''green'' if is_state(''binary_sensor.c3_chauffage_sdb'', ''on'') else (''red'' if is_state(''binary_sensor.c3_chauffage_sdb'', ''off'') else ''grey'') }}'
        content: NoeudChauffageSdb · {{ 'Marche' if is_state('switch.chauffage', 'on') else ('Arrêt' if is_state('switch.chauffage', 'off') else '?') }}
        tap_action:
          action: navigate
          navigation_path: /dashboard-accueil/lumieres
        card_mod:
          style: |
            ha-card {
              --chip-background: {{ 'rgba(76,175,80,0.2)' if is_state('binary_sensor.c3_chauffage_sdb', 'on') else ('rgba(229,115,115,0.2)' if is_state('binary_sensor.c3_chauffage_sdb', 'off') else 'rgba(158,158,158,0.2)') }};
              --primary-text-color: {{ '#4caf50' if is_state('binary_sensor.c3_chauffage_sdb', 'on') else ('#e57373' if is_state('binary_sensor.c3_chauffage_sdb', 'off') else '#9e9e9e') }};
            }
  cards: []
- type: sections
  max_columns: 4
  title: Actionneurs
  path: lumieres
  icon: mdi:car-light-high
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Chaudière
      heading_style: title
      icon: mdi:fire
    - type: vertical-stack
      cards:
      - type: custom:mushroom-template-card
        entity: binary_sensor.thsdb_eveille
        primary: ThSdb (voyant chaudière)
        secondary: |-
          {%- set e = states('binary_sensor.thsdb_eveille') -%}
          {%- set a = states('sensor.thsdb_commande_en_attente') -%}
          {%- set r = states('sensor.thsdb_prochain_reveil') -%}
          {%- if e == 'on' -%}Éveillé
          {#- Endormissement automatique (packages/thsdb_sommeil.yaml) : mêmes conditions que l'automatisation -#}
          {%- if state_attr('sensor.thsdb_config', 'sleepA') == 0 -%}
          {%- if is_state('sensor.coulsdb_del', 'Allumee') %} · reste éveillé (chaudière allumée)
          {%- elif not is_state('sensor.coulsdb_del', 'Eteinte') %} · reste éveillé (voyant chaudière inconnu)
          {%- elif not is_state('climate.chaudiere_rdc', 'off') %} · reste éveillé (thermostat en chauffage)
          {%- else -%}
          {%- set d = (states('input_number.thsdb_delai_sommeil') | float(30)) * 60 -%}
          {%- set c = states('sensor.thsdb_config') -%}
          {%- set ts = [as_timestamp(states.sensor.coulsdb_del.last_changed), as_timestamp(states.climate.chaudiere_rdc.last_changed)]
               + ([as_timestamp(c)] if c not in ['unknown', 'unavailable', ''] else []) -%}
          {%- set fin = (ts | max) + d -%}
          {%- set s = fin - as_timestamp(now()) -%}
          {%- if s > 0 %} · s'endort vers {{ fin | timestamp_custom('%H:%M') }} (dans {{ (s / 60) | round(0, 'ceil') | int }} min)
          {%- else %} · endormissement imminent
          {%- endif -%}
          {%- endif -%}
          {%- endif -%}
          {%- elif e == 'off' -%}Endormi
          {%- if r not in ['unknown', 'unavailable', ''] -%}
          {%- set t = as_datetime(r) -%}
          {%- set s = (t - now()).total_seconds() -%}
          {%- if s > 0 %} · réveil vers {{ as_local(t).strftime('%H:%M') }} (dans {{ (s / 60) | round(0, 'ceil') | int }} min)
          {%- elif s > -60 %} · réveil imminent
          {%- else %} · réveil attendu depuis {{ (-s / 60) | int }} min
          {%- endif -%}
          {%- endif -%}
          {%- else -%}Inconnu
          {%- endif -%}
          {%- if a not in ['aucune', 'unknown', 'unavailable', ''] %} · en attente : {{ a }}{% endif %}
        icon: '{{ ''mdi:sleep-off'' if is_state(''binary_sensor.thsdb_eveille'', ''on'') else ''mdi:sleep'' }}'
        tap_action:
          action: more-info
        card_mod:
          style: |
            ha-state-icon {
              color: {{ 'green' if is_state('binary_sensor.thsdb_eveille', 'on') else ('red' if is_state('binary_sensor.thsdb_eveille', 'off') else 'grey') }} !important;
            }
            .shape {
              background: none !important;
            }
      - type: horizontal-stack
        cards:
        - type: vertical-stack
          cards:
          - type: custom:mushroom-entity-card
            entity: sensor.coulsdb_del
            name: Chaudiere
            icon: mdi:fire
            card_mod:
              style: |
                ha-state-icon {
                  color: {{ 'green' if states('sensor.coulsdb_del') == 'Allumee' else 'red' }} !important;
                }
                .shape {
                  background: none !important;
                }
          - type: horizontal-stack
            cards:
            - type: custom:button-card
              entity: switch.chaudiere_enable
              name: ''
              show_name: false
              tap_action:
                action: toggle
              icon: |
                [[[return states['switch.chaudiere_enable'].state === 'on' ? 'mdi:lock-open' : 'mdi:lock']]]
              styles:
                card:
                - height: 60px
                - background: |
                    [[[return states['switch.chaudiere_enable'].state === 'on' ? 'rgba(0,200,0,0.2)' : 'rgba(200,0,0,0.2)']]]
                icon:
                - color: |
                    [[[return states['switch.chaudiere_enable'].state === 'on' ? 'green' : 'red']]]
            - type: custom:button-card
              entity: switch.chaudiere
              name: ''
              show_name: false
              tap_action:
                action: toggle
              icon: mdi:power
              styles:
                card:
                - height: 60px
                - background: |
                    [[[return states['sensor.coulsdb_del'].state === 'Allumee' ? 'rgba(0,200,0,0.2)' : 'rgba(200,0,0,0.2)']]]
                icon:
                - color: |
                    [[[return states['sensor.coulsdb_del'].state === 'Allumee' ? 'green' : 'red']]]
    - type: heading
      heading: Autres actionneurs
      heading_style: title
      icon: mdi:toggle-switch
    - type: vertical-stack
      cards:
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          entity: switch.projecteur_enable
          name: ''
          show_name: false
          tap_action:
            action: toggle
          icon: |
            [[[return states['switch.projecteur_enable'].state === 'on' ? 'mdi:lock-open' : 'mdi:lock']]]
          styles:
            card:
            - height: 60px
            - width: 60px
            - background: |
                [[[return states['switch.projecteur_enable'].state === 'on' ? 'rgba(0,200,0,0.2)' : 'rgba(200,0,0,0.2)']]]
            icon:
            - color: |
                [[[return states['switch.projecteur_enable'].state === 'on' ? 'green' : 'red']]]
        - type: custom:button-card
          entity: switch.projecteur
          name: Projecteur
          tap_action:
            action: toggle
          icon: mdi:projector
          styles:
            card:
            - height: 60px
            - background: |
                [[[return states['switch.projecteur'].state === 'on' ? 'rgba(0,200,0,0.2)' : 'rgba(200,0,0,0.2)']]]
            icon:
            - color: |
                [[[return states['switch.projecteur'].state === 'on' ? 'green' : 'red']]]
        - type: conditional
          conditions:
          - condition: state
            entity: binary_sensor.guirlande_verification_en_cours
            state_not: 'on'
          card:
            type: custom:button-card
            entity: switch.guirlande
            name: Guirlande
            tap_action:
              action: toggle
            icon: mdi:string-lights
            styles:
              card:
              - height: 60px
              - background: |
                  [[[return states['switch.guirlande'].state === 'on' ? 'rgba(0,200,0,0.2)' : 'rgba(200,0,0,0.2)']]]
              icon:
              - color: |
                  [[[return states['switch.guirlande'].state === 'on' ? 'green' : 'red']]]
        - type: conditional
          conditions:
          - condition: state
            entity: binary_sensor.guirlande_verification_en_cours
            state: 'on'
          card:
            type: custom:button-card
            entity: binary_sensor.guirlande_verification_en_cours
            name: Guirlande
            icon: mdi:timer-sand
            spin: true
            show_state: false
            tap_action:
              action: none
            hold_action:
              action: none
            double_tap_action:
              action: none
            styles:
              card:
              - height: 60px
              - background: rgba(255,152,0,0.25)
              icon:
              - color: orange
        - type: custom:button-card
          entity: switch.guirlande_enable
          name: ''
          show_name: false
          tap_action:
            action: toggle
          icon: |
            [[[return states['switch.guirlande_enable'].state === 'on' ? 'mdi:lock-open' : 'mdi:lock']]]
          styles:
            card:
            - height: 60px
            - width: 60px
            - background: |
                [[[return states['switch.guirlande_enable'].state === 'on' ? 'rgba(0,200,0,0.2)' : 'rgba(200,0,0,0.2)']]]
            icon:
            - color: |
                [[[return states['switch.guirlande_enable'].state === 'on' ? 'green' : 'red']]]
      - type: custom:button-card
        entity: binary_sensor.c3_chauffage_sdb
        show_icon: false
        show_name: false
        show_state: false
        show_label: true
        tap_action:
          action: none
        hold_action:
          action: more-info
        label: |
          [[[
            const r = states['sensor.c3_chauffage_sdb_rssi'];
            const v = r ? parseFloat(r.state) : NaN;
            if (entity && entity.state === 'on' && !isNaN(v)) return `C3 · ${v} dBm`;
            if (entity && entity.state === 'off') return 'C3 · hors ligne';
            return 'C3 · —';
          ]]]
        styles:
          card:
          - height: 40px
          - background: |
              [[[
                if (!entity) return 'rgba(128,128,128,0.2)';
                if (entity.state === 'on') return 'rgba(0,200,0,0.2)';
                if (entity.state === 'off') return 'rgba(200,0,0,0.2)';
                return 'rgba(128,128,128,0.2)';
              ]]]
          label:
          - font-size: 15px
          - font-weight: 600
          - color: "[[[\n  if (!entity) return 'grey';\n  if (entity.state === 'on') return 'green';\n  if (entity.state === 'off') return 'red';\n  return 'grey';\n]]]                \n"
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          entity: switch.chauffage_enable
          name: ''
          show_name: false
          tap_action:
            action: toggle
          icon: |
            [[[return states['switch.chauffage_enable'].state === 'on' ? 'mdi:lock-open' : 'mdi:lock']]]
          styles:
            card:
            - height: 60px
            - width: 60px
            - background: |
                [[[return states['switch.chauffage_enable'].state === 'on' ? 'rgba(0,200,0,0.2)' : 'rgba(200,0,0,0.2)']]]
            icon:
            - color: |
                [[[return states['switch.chauffage_enable'].state === 'on' ? 'green' : 'red']]]
        - type: custom:button-card
          entity: switch.chauffage
          name: Chauffage Sdb
          tap_action:
            action: toggle
          icon: mdi:radiator
          styles:
            card:
            - height: 60px
            - background: |
                [[[return states['switch.chauffage'].state === 'on' ? 'rgba(0,200,0,0.2)' : 'rgba(200,0,0,0.2)']]]
            icon:
            - color: |
                [[[return states['switch.chauffage'].state === 'on' ? 'green' : 'red']]]
        - type: custom:button-card
          entity: switch.chauffage_enable
          name: ''
          show_name: false
          tap_action:
            action: toggle
          icon: |
            [[[return states['switch.chauffage_enable'].state === 'on' ? 'mdi:lock-open' : 'mdi:lock']]]
          styles:
            card:
            - height: 60px
            - width: 60px
            - background: |
                [[[return states['switch.chauffage_enable'].state === 'on' ? 'rgba(0,200,0,0.2)' : 'rgba(200,0,0,0.2)']]]
            icon:
            - color: |
                [[[return states['switch.chauffage_enable'].state === 'on' ? 'green' : 'red']]]
    - type: custom:scheduler-card
      title: Programmation chauffage SDB
      include:
      - switch.chauffage_sdb_programme
      time_step: 15
      show_header_toggle: false
    - type: horizontal-stack
      cards:
      - type: custom:button-card
        entity: switch.chauffage_rdc_enable
        name: ''
        show_name: false
        tap_action:
          action: toggle
        icon: |
          [[[return states['switch.chauffage_rdc_enable'].state === 'on' ? 'mdi:lock-open' : 'mdi:lock']]]
        styles:
          card:
          - height: 60px
          - width: 60px
          - background: |
              [[[return states['switch.chauffage_rdc_enable'].state === 'on' ? 'rgba(0,200,0,0.2)' : 'rgba(200,0,0,0.2)']]]
          icon:
          - color: |
              [[[return states['switch.chauffage_rdc_enable'].state === 'on' ? 'green' : 'red']]]
      - type: custom:button-card
        entity: switch.chauffage_rdc
        name: Chauffage RdC
        tap_action:
          action: toggle
        icon: mdi:radiator
        styles:
          card:
          - height: 60px
          - background: |
              [[[return states['switch.chauffage_rdc'].state === 'on' ? 'rgba(0,200,0,0.2)' : 'rgba(200,0,0,0.2)']]]
          icon:
          - color: |
              [[[return states['switch.chauffage_rdc'].state === 'on' ? 'green' : 'red']]]
    - type: custom:button-card
      entity: sensor.jncave_etat
      show_icon: false
      show_name: false
      show_state: false
      show_label: true
      tap_action:
        action: none
      hold_action:
        action: more-info
      label: |
        [[[
          const e = states['sensor.jncave_eclairement'];
          const v = e ? parseFloat(e.state) : NaN;
          if (entity && (entity.state === 'Jour' || entity.state === 'Nuit'))
            return isNaN(v) ? `Cave · ${entity.state}` : `Cave · ${entity.state} · ${v} %`;
          return 'Cave · —';
        ]]]
      styles:
