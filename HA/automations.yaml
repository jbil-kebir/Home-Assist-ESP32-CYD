- id: '1774736517752'
  alias: CYD - Recevoir Alive
  description: 'Trame « <nom du CYD> ALIVEWDOG <date> <heure> <IP> » : seulement celle du
    CYD principal (« CYD HA ») ; les CYD auxiliaires publient aussi sur ce topic.'
  triggers:
  - topic: home/configuration/state
    trigger: mqtt
  conditions:
  - condition: template
    value_template: '{{ trigger.payload.split('' ALIVEWDOG '')[0] == ''CYD HA'' }}'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.cyd_alive
    data:
      value: '{{ now().strftime(''%d/%m/%Y %H:%M:%S'') }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.ip_cyd
    data:
      value: '{{ trigger.payload.split('' '')[-1] }}'
  mode: single
