- id: '1774944736290'
  alias: NAS - Publier etat MQTT
  triggers:
  - trigger: time_pattern
    hours: /1
  actions:
  - action: mqtt.publish
    data:
      topic: home/homeassistant/state
      payload: 'NewNas ETAT {{ now().strftime(''%d/%m/%Y %H:%M:%S'') }} {{ ''1'' if
        states(''sensor.newnas_sante'') == ''ok'' else ''0'' }} {{states(''input_text.ip_newnas'')
        }}

        '
  - action: mqtt.publish
    data:
      topic: home/homeassistant/state
      payload: 'BigNas ETAT {{ now().strftime(''%d/%m/%Y %H:%M:%S'') }} {{ ''1'' if
        states(''sensor.bignas_sante'') == ''ok'' else ''0'' }} {{states(''input_text.ip_bignas'')}}

        '
  mode: single
