- id: '1777300000001'
  alias: Relais LoRa - Recevoir IP
  description: Annonce de démarrage du relais « DEVICE RELAIS LORA <nom> <date> <heure>
    <IP> »
  triggers:
  - topic: home/configuration/command
    trigger: mqtt
  conditions:
  - condition: template
    value_template: '{{ trigger.payload.upper().startswith(''DEVICE RELAIS LORA'')
      and trigger.payload.split('' '')[-1] is match(''^\d{1,3}(\.\d{1,3}){3}$'') }}'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.ip_relaislora
    data:
      value: '{{ trigger.payload.split('' '')[-1] }}'
  mode: single
