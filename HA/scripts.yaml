chaudiere_allumer:
  alias: "Chaudière - Activer et allumer"
  sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.chaudiere_enable
    - delay: "00:00:02"
    - action: switch.turn_on
      target:
        entity_id: switch.chaudiere
        
chaudiere_eteindre:
  alias: "Chaudière - Éteindre et désactiver"
  sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.chaudiere
    - delay: "00:00:02"
    - action: switch.turn_off
      target:
        entity_id: switch.chaudiere_enable
        
# ============================================================
# MESURE ITINÉRANTE - Démarrer une nouvelle mesure
# À lancer à chaque fois qu'on branche la Eve sur un nouvel appareil
# ============================================================
demarrer_mesure:
  alias: Démarrer une mesure
  icon: mdi:play-circle
  sequence:
    # 1. Mémoriser la date/heure actuelle comme début de mesure
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.mesure_debut
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

    # 2. Mémoriser la valeur actuelle du compteur Eve (kWh cumulés)
    - action: input_number.set_value
      target:
        entity_id: input_number.mesure_energie_debut
      data:
        value: "{{ states('sensor.eve_energy_20ebo8301_energie_2') | float(0) }}"
        
        