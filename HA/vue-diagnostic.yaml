# Vue « Diagnostic » du tableau Système (https://ha.jbil.org/dashboard-systeme/diagnostic)
# Généré par genere_noeuds.py à partir de .storage/lovelace.dashboard_systeme + section « Versions des firmwares »
# (sensor.<id>_version : packages/noeuds_capteurs.yaml et packages/cyd.yaml).
# Installation : tableau Système → ✏️ → vue Diagnostic → ⋮ → « Modifier en YAML » → remplacer par ce fichier.
type: sections
max_columns: 4
title: Diagnostic
path: diagnostic
icon: mdi:heart-pulse
show_icon_and_title: true
sections:
- type: grid
  cards:
  - type: heading
    heading: Versions des firmwares
    heading_style: title
    icon: mdi:chip
  - type: markdown
    content: |
      {%- set eq = [
          ('sensor.cyd_version', 'CYD principal', 'Home-Assist'),
          ('sensor.cyd_aux_version', 'CYD Aux', 'Home-Assist'),
          ('sensor.cyd_aux2_version', 'CYD Aux 2', 'Home-Assist'),
          ('sensor.relaislora_version', 'Relais LoRa', 'Relais-Lora'),
          ('sensor.thremise_version', 'ThRemise', 'Capteur'),
          ('sensor.thcave_version', 'ThCave', 'Capteur'),
          ('sensor.thchrdc_version', 'ThChRDC', 'Capteur'),
          ('sensor.thch1er_version', 'ThCh1er', 'Capteur'),
          ('sensor.thsdb_version', 'ThSdb', 'Capteur'),
          ('sensor.prguirlande_version', 'PrGuirlande', 'Capteur'),
          ('sensor.noeud_version', 'Nœud chauffage SdB', 'Capteur')
      ] -%}
      {%- set ns = namespace(max={}) -%}
      {%- for e, lib, fam in eq -%}
        {%- set v = states(e) -%}
        {%- if v | regex_match('^[0-9]+(\.[0-9]+)*$') -%}
          {%- set t = v.split('.') | map('int') | list -%}
          {%- if fam not in ns.max or t > ns.max[fam] -%}{%- set ns.max = dict(ns.max, **{fam: t}) -%}{%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      | Équipement | Firmware | Version | Compilée le | Reçue |
      |:--|:--|:--:|:--:|:--|
      {%- for e, lib, fam in eq %}
      {%- set v = states(e) %}
      {%- set connue = v | regex_match('^[0-9]+(\.[0-9]+)*$') %}
      {%- set r = state_attr(e, 'recu') %}
      | {{ lib }} | {{ fam }} | {% if not connue %}—{% elif (v.split('.') | map('int') | list) < ns.max[fam] %}⚠️ **{{ v }}**{% else %}{{ v }}{% endif %} | {{ state_attr(e, 'compilation') or '—' }} | {{ relative_time(as_datetime(r)) if r else 'jamais' }} |
      {%- endfor %}

      ⚠️ : plus ancienne que la version la plus récente du même firmware. Envoyée au démarrage, et en réponse à GET (nœuds) ou STATUS (CYD, relais).
    grid_options:
      columns: full
- type: grid
  cards:
  - type: heading
    heading: Mises à jour du firmware
    heading_style: title
    icon: mdi:update
  - type: markdown
    content: |
      {%- set eq = [
          ('sensor.relaislora_mise_a_jour_firmware', 'Relais LoRa'),
          ('sensor.configuration_mise_a_jour_firmware', 'CYD principal'),
          ('sensor.configaux_mise_a_jour_firmware', 'CYD Aux'),
          ('sensor.configaux2_mise_a_jour_firmware', 'CYD Aux2'),
          ('sensor.thchrdc_mise_a_jour_firmware', 'ThChRDC'),
          ('sensor.thch1er_mise_a_jour_firmware', 'ThCh1er'),
          ('sensor.thsdb_mise_a_jour_firmware', 'ThSdb'),
          ('sensor.thremise_mise_a_jour_firmware', 'ThRemise'),
          ('sensor.thcave_mise_a_jour_firmware', 'ThCave'),
          ('sensor.noeud_mise_a_jour_firmware', 'NoeudChauffageSdb'),
          ('sensor.prguirlande_mise_a_jour_firmware', 'PrGuirlande')
      ] -%}
      | Appareil | Dernière étape | Détail | Quand |
      |:--|:--:|:--|:--|
      {%- for e, lib in eq %}
      {%- set s = states(e) %}
      | {{ lib }} | {{ {'OK': '✅ OK', 'ECHEC': '❌ ÉCHEC', 'RETOUR': '↩️ RETOUR', 'DEBUT': '⏳ début', 'TRANSFERT': '⏳ transfert', 'ATTENTE': '🔧 en attente'}.get(s, '—') }} | {{ state_attr(e, 'message') or 'aucune mise à jour' }} | {{ relative_time(states[e].last_changed) if s not in ['unknown', 'unavailable'] else '—' }} |
      {%- endfor %}

      **Comment** : dans VS Code, profil `<appareil>_ota` puis flèche « Upload » (ou page `http://<IP>/update`, même mot de passe, secret.h). Notification à chaque étape, mail du résultat.

      - **Relais LoRa, CYD** : toujours joignables ; **NoeudChauffageSdb** : dès qu'il est alimenté (relais du chauffage).
      - **Nœud Wi-Fi** : éveillé (`sleepA:0`) ou **mode maintenance** (vue Nœuds capteurs : interrupteur Maintenance, attendre 🔧 au réveil du nœud, puis Upload ; sommeil normal rétabli à la fin).
      - **Nœud LoRa** (ThRemise .240, ThCave .241) : répéteur Wi-Fi à quelques mètres du nœud (pas collé), **mode maintenance** (interrupteur, ordre remis au réveil par le relais), attendre 🔧, puis Upload ; le nœud reste en maintenance après le redémarrage. OK environ 15 s après le redémarrage.
    grid_options:
      columns: full
- type: grid
  cards:
  - type: vertical-stack
    cards:
    - type: heading
      heading: OTBR / Thread
      heading_style: title
      icon: mdi:stethoscope
    - type: entities
      entities:
      - entity: sensor.eve_poele_puissance
        name: Eve Poêle - Puissance
        secondary_info: last-updated
      - entity: sensor.eve_itinerante_puissance
        name: Eve Itinérante - Puissance
        secondary_info: last-updated
      - entity: sensor.eve_nas_puissance
        name: Eve NAS - Puissance
        secondary_info: last-updated
    - type: entity
      entity: update.openthread_border_router_mise_a_jour
      name: OTBR - Version
    - type: button
      name: Redemarrer OTBR
      icon: mdi:restart
      tap_action:
        action: call-service
        service: hassio.addon_restart
        data:
          addon: core_openthread_border_router
      card_mod:
        style: |
          ha-card {
            height: 60px !important;
            background: rgba(255,165,0,0.2) !important;
          }
          ha-icon {
            color: orange !important;
          }
  - type: vertical-stack
    cards:
    - type: heading
      heading: Linky
      heading_style: title
      icon: mdi:stethoscope
    - type: entities
      entities:
      - entity: sensor.linky_index_base
        name: Index base
        secondary_info: last-updated
      - entity: sensor.linky_puissance_apparente
        name: Puissance apparente
        secondary_info: last-updated
- type: grid
  cards:
  - type: heading
    heading: Journal CYD
    heading_style: title
    icon: mdi:text-box-outline
  - type: logbook
    entities:
    - sensor.cyd_log
    hours_to_show: 24
    grid_options:
      columns: full
      rows: 8
