    max: 10
    icon: mdi:currency-eur

  linky_date_facture:
    name: "Linky Date Facture"
    max: 10
    icon: mdi:calendar
    
  linky_consommation_derniere_facture:
    name: "Linky Conso dernière Facture"
    max: 10
    icon: mdi:receipt
  linky_cout_derniere_facture:
    name: "Linky Cout dernière facture"
    max: 10
    icon: mdi:currency-eur

    
climate:
  - platform: generic_thermostat
    name: Chaudière RDC
    heater: switch.chaudiere_programmation
    target_sensor: sensor.thchrdc_temperature
    min_temp: 15
    max_temp: 25
    cold_tolerance: 0.5
    hot_tolerance: 0.5
    target_temp: 20
    

notify:
  - name: email_kebir
    platform: smtp
    server: smtp.gmail.com
    port: 587
    starttls: true
    sender: jbil.kebir@gmail.com
    username: jbil.kebir@gmail.com
    password: !secret gmail_app_password
    recipient:
      - jbil.kebir@gmail.com

    
template:
  - sensor:
      - name: "NewNas Sante"
        state: >
          {{ 'ok' if states('sensor.newnas_volume_1_etat') == 'normal'
            and states('sensor.newnas_drive_1_etat') == 'normal'
            and states('sensor.newnas_drive_2_etat') == 'normal'
            and states('binary_sensor.newnas_drive_1_en_dessous_de_la_duree_de_vie_restante_minimale') == 'off'
            and states('binary_sensor.newnas_drive_1_depassement_du_nombre_maximal_de_secteurs_defectueux') == 'off'
            and states('binary_sensor.newnas_drive_2_en_dessous_de_la_duree_de_vie_restante_minimale') == 'off'
            and states('binary_sensor.newnas_drive_2_depassement_du_nombre_maximal_de_secteurs_defectueux') == 'off'
            else 'probleme' }}
      - name: "BigNas Sante"
        state: >
          {{ 'ok' if states('sensor.bignas_volume_1_etat') == 'normal'
            and states('sensor.bignas_drive_1_etat') == 'normal'
            and states('sensor.bignas_drive_2_etat') == 'normal'
            and states('binary_sensor.bignas_drive_1_en_dessous_de_la_duree_de_vie_restante_minimale') == 'off'
            and states('binary_sensor.bignas_drive_1_depassement_du_nombre_maximal_de_secteurs_defectueux') == 'off'
            and states('binary_sensor.bignas_drive_2_en_dessous_de_la_duree_de_vie_restante_minimale') == 'off'
            and states('binary_sensor.bignas_drive_2_depassement_du_nombre_maximal_de_secteurs_defectueux') == 'off'
            else 'probleme' }}
            
      - name: "Linky Consommation Depuis Facture"
        unit_of_measurement: "kWh"
        state: >
          {{ (states('sensor.linky_index_base') | float - states('input_text.linky_index_facture') | float) | round(1) }}     
          
      - name: "Linky Cout Depuis Facture"
        unit_of_measurement: "€"
        state: >
          {{ ((states('sensor.linky_index_base') | float - states('input_text.linky_index_facture') | float) * states('input_text.linky_cout_kwh') | float) | round(2) }}          
          
  - switch:
      - name: "Chaudiere Programme"
        unique_id: chaudiere_programme
        state: "{{ is_state('switch.chaudiere', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target:
              entity_id: switch.chaudiere_enable
          - action: switch.turn_on
            target:
              entity_id: switch.chaudiere
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.chaudiere
          - action: switch.turn_off
            target:
              entity_id: switch.chaudiere_enable