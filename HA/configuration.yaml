      unique_id: thsdb_temp
      state_topic: "home/thermometre/state"
      unit_of_measurement: "°C"
      device_class: temperature
      value_template: >
        {% set parts = value.split(' ') %}
        {% if parts[0]|upper == 'THSDB' and parts[1]|upper == 'TEMP' %}
          {{ parts[4] }}
        {% else %}
          {{ states('sensor.thsdb_temperature') }}
        {% endif %}

