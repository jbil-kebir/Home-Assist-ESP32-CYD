# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Incl;ure d'autres fichiers de config
homeassistant:
  packages: !include_dir_named packages
  # Dossiers dont HA peut lire les fichiers (pièces jointes des e-mails)
  allowlist_external_dirs:
    - /config/rapports
  
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.30.33.0/24
    
mqtt:
  switch:
    - name: "Projecteur"
      unique_id: mqtt_projecteur
      command_topic: "home/projecteur/command"
      state_topic: "home/projecteur/command"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ONR"
      state_off: "OFFR"
      icon: mdi:projector

    - name: "Guirlande"
      unique_id: mqtt_guirlande
      command_topic: "home/guirlande/command"
      state_topic: "home/guirlande/command"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ONR"
      state_off: "OFFR"
      icon: mdi:string-lights

    - name: "Chauffage"
      unique_id: mqtt_chauffage
      command_topic: "home/chauffage/command"
      state_topic: "home/chauffage/command"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ONR"
      state_off: "OFFR"
      icon: mdi:radiator      
      
    - name: "Chaudiere"
      unique_id: mqtt_chaudiere
      command_topic: "home/chaudiere/command"
      state_topic: "home/chaudiere/command"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ONR"
      state_off: "OFFR"
      icon: mdi:fire

    - name: "Chaudiere Enable"
      unique_id: mqtt_chaudiere_enable
      command_topic: "home/chaudiere/command"
      state_topic: "home/chaudiere/command"
      payload_on: "ENABLE"
      payload_off: "DISABLE"
      state_on: "ENABLER"
      state_off: "DISABLER"
      icon: mdi:fire

    - name: "Projecteur Enable"
      unique_id: mqtt_projecteur_enable
      command_topic: "home/projecteur/command"
      state_topic: "home/projecteur/command"
      payload_on: "ENABLE"
      payload_off: "DISABLE"
      state_on: "ENABLER"
      state_off: "DISABLER"
      icon: mdi:projector

    - name: "Guirlande Enable"
      unique_id: mqtt_guirlande_enable
      command_topic: "home/guirlande/command"
      state_topic: "home/guirlande/command"
      payload_on: "ENABLE"
      payload_off: "DISABLE"
      state_on: "ENABLER"
      state_off: "DISABLER"
      icon: mdi:string-lights

    # Lumière de la cave : prise 433 MHz (code 1FCF24, protocole 1, 301 µs) émise par le CYD principal (main_lumierecave.cpp)
    - name: "Lumière cave"
      unique_id: mqtt_lumiere_cave
      command_topic: "home/lumierecave/command"
      state_topic: "home/lumierecave/command"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ONR"
      state_off: "OFFR"
      icon: mdi:lightbulb

    - name: "Lumière cave Enable"
      unique_id: mqtt_lumiere_cave_enable
      command_topic: "home/lumierecave/command"
      state_topic: "home/lumierecave/command"
      payload_on: "ENABLE"
      payload_off: "DISABLE"
      state_on: "ENABLER"
      state_off: "DISABLER"
      icon: mdi:lightbulb

    - name: "Chauffage Enable"
      unique_id: mqtt_chauffage_enable
      command_topic: "home/chauffage/command"
      state_topic: "home/chauffage/command"
      payload_on: "ENABLE"
      payload_off: "DISABLE"
      state_on: "ENABLER"
      state_off: "DISABLER"
      icon: mdi:radiator

    - name: "Chaudiere Programmation"
      unique_id: mqtt_chaudiere_programmation
      command_topic: "home/chaudiere/command"
      payload_on: "ON_FORCE"
      payload_off: "OFF_FORCE"
      state_topic: "home/chaudiere/command"
      state_on: "ONR"
      state_off: "OFFR"
      icon: mdi:fire
      
