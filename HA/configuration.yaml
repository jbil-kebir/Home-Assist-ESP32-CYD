# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Incl;ure d'autres fichiers de config
homeassistant:
  packages: !include_dir_named packages
  # Dossiers dont HA peut lire les fichiers (pièces jointes des e-mails)
  allowlist_external_dirs:
    - /config/rapports
  
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.30.33.0/24
    
# Entités MQTT : HA refuse de fusionner des blocs « mqtt: » venant des paquets, d'où les !include
#  - interrupteurs (actionneurs du CYD) : mqtt/interrupteurs.yaml
#  - capteurs : un fichier par nœud dans mqtt/capteurs/ (thsdb.yaml, thcave.yaml…)
mqtt:
  switch: !include mqtt/interrupteurs.yaml
  sensor: !include_dir_merge_list mqtt/capteurs/

notify:
  - name: email_kebir
    platform: smtp
    server: smtp.gmail.com
    port: 587
    starttls: true
    sender: jbil.kebir@gmail.com
    username: jbil.kebir@gmail.com
    password: !secret gmail_app_password
    recipient:
      - jbil.kebir@gmail.com
