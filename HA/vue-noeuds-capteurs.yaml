# Vue « Nœuds capteurs » du tableau Système (https://ha.jbil.org/dashboard-systeme/noeuds-capteurs)
# Généré par genere_noeuds.py (entités et scripts : packages/noeuds_capteurs.yaml).
# Installation : tableau Système → ✏️ → vue « Capteurs LoRa » (ou « + » nouvelle vue) → ⋮ → « Modifier en YAML »
# → remplacer par ce fichier → Enregistrer.
type: sections
max_columns: 4
title: Nœuds capteurs
path: noeuds-capteurs
icon: mdi:access-point-network
show_icon_and_title: true
sections:
  # ======================= ThRemise (LoRa) =======================
  - type: grid
    cards:
      - type: vertical-stack
        cards:
          - type: heading
            heading: ThRemise · LoRa
            heading_style: title
            icon: mdi:radio-tower
          - type: entities
            entities:
              - entity: binary_sensor.thremise_eveille
                name: Éveillé
              - entity: sensor.thremise_derniere_trame
                name: Dernière trame
                format: relative
              - entity: sensor.thremise_commande_en_attente
                name: Commande en attente
              - entity: sensor.thremise_config
                name: Config reçue
                format: relative
          - type: entities
            title: Mesures
            entities:
              - entity: sensor.thremise_temperature
                name: Température
              - entity: sensor.thremise_humidite
                name: Humidité
              - entity: sensor.batremise_tension
                name: Batterie
              - entity: sensor.batremise_etat
                name: État batterie
              - entity: sensor.flotteur_remise
                name: Flotteur
          - type: markdown
            content: |
              {% if state_attr('sensor.thremise_config', 'mute') == 1 %}
              🔇 **Mesures muettes** : ThRemise n'émet plus ses mesures (MUTE OFF pour les rétablir).

              {% endif %}
              {% set r = states('sensor.thremise_rapport') %}
              {% if r not in ['unknown', 'unavailable'] %}
              **État** (reçu {{ relative_time(as_datetime(state_attr('sensor.thremise_rapport', 'recu'))) }}) :

              {{ r | replace(' | ', '  \n') }}
              {% else %}
              *Pas encore de réponse au bouton État.*
              {% endif %}
              {% set e = state_attr('sensor.thremise_config', 'erreur') %}
              {% if e %}

              ⚠️ **Refusé par le nœud** : {{ e }}
              {% endif %}
          - type: horizontal-stack
            cards:
              - type: button
                name: Relire
                icon: mdi:refresh
                tap_action:
                  action: perform-action
                  perform_action: script.noeud_commande
                  data:
                    capteur: thremise
                    commande: GET
                card_mod:
                  style: "ha-card { height: 60px !important; }"
              - type: button
                name: État
                icon: mdi:information
                tap_action:
                  action: perform-action
                  perform_action: script.noeud_commande
                  data:
                    capteur: thremise
                    commande: STATUS
                card_mod:
                  style: "ha-card { height: 60px !important; }"
              - type: button
                name: Annuler
                icon: mdi:cancel
                tap_action:
                  action: perform-action
                  perform_action: script.noeud_commande
                  data:
                    capteur: thremise
                    commande: ANNULER
                card_mod:
                  style: "ha-card { height: 60px !important; }"
              - type: button
                name: Redémarrer
                icon: mdi:restart
                tap_action:
                  action: perform-action
                  perform_action: script.noeud_commande
                  data:
                    capteur: thremise
                    commande: REBOOT
                  confirmation:
                    text: Redémarrer ThRemise à son prochain réveil ?
                card_mod:
                  style: |
                    ha-card {
                      height: 60px !important;
                      background: rgba(200,0,0,0.2) !important;
                    }
                    ha-icon { color: red !important; }
      - type: vertical-stack
        cards:
          - type: entities
            title: Réglages (envoyés au prochain réveil)
            entities:
              - entity: input_boolean.thremise_sleepa
                name: Deep sleep actif
              - entity: input_number.thremise_sleepi
                name: Intervalle deep sleep
              - entity: input_number.thremise_sleeps
                name: Sommeil court (SLEEPS)
              - entity: input_number.thremise_sleepm
                name: Sommeil moyen (SLEEPM)
              - entity: input_number.thremise_sleepl
                name: Sommeil long (SLEEPL)
              - entity: input_number.thremise_wakei
                name: Éveil maximum
              - entity: input_boolean.thremise_mute
                name: Mesures muettes
          - type: button
            name: Enregistrer
            icon: mdi:content-save
            tap_action:
              action: perform-action
              perform_action: script.noeud_enregistrer
              data:
                capteur: thremise
            # Grisé et non cliquable tant qu'aucune config n'a été reçue du nœud (le script refuse aussi)
            card_mod:
              style: |
                ha-card {
                  height: 60px !important;
                  {% if states('sensor.thremise_config') in ['unknown', 'unavailable'] %}
                  opacity: 0.4;
                  pointer-events: none;
                  {% endif %}
                }
          - type: entities
            title: Commande libre
            entities:
              - entity: input_text.thremise_commande
                name: Commande
          - type: horizontal-stack
            cards:
              - type: button
                name: Envoyer
                icon: mdi:send
                tap_action:
                  action: perform-action
                  perform_action: script.noeud_commande_libre
                  data:
                    capteur: thremise
                card_mod:
                  style: "ha-card { height: 60px !important; }"
              - type: button
                name: Nettoyer retenu
                icon: mdi:broom
                tap_action:
                  action: perform-action
                  perform_action: script.noeud_nettoyer_retenu
                  data:
                    capteur: thremise
                  confirmation:
                    text: Effacer le message retenu sur home/confthremise/command ?
                card_mod:
                  style: "ha-card { height: 60px !important; }"

