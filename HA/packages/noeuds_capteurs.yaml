script:
  # ------------------------------------------------------------
  # Envoie une commande au nœud.
  # LoRa : via la file d'attente du relais (envoyée au prochain réveil ; ANNULER est traité par le relais).
  # Wi-Fi : publiée en RETENU (le nœud la lit à son réveil) ; effacée par l'automatisation
  #         « Nœuds Wi-Fi - Effacer la commande retenue » ; ANNULER = effacement du message retenu.
  #         Nœuds « sans_retenu » (toujours éveillés, sans « online ») : publiée sans retenu.
  # Refusée si une commande attend déjà (sauf ANNULER) : une nouvelle commande remplacerait celle qui attend.
  # ------------------------------------------------------------
  noeud_commande:
    alias: Nœud capteur - Envoyer une commande
    icon: mdi:send
    mode: queued
    fields:
      capteur:
        name: Nœud
        description: Identifiant du nœud (thremise, thchrdc...)
        required: true
        example: thchrdc
        selector:
          text:
      commande:
        name: Commande
        description: GET, STATUS, REBOOT, ANNULER, SET cle:valeur..., SLEEP..., WDOG...
        required: true
        example: STATUS
        selector:
          text:
    sequence:
      - variables:
          # Nœuds LoRa (les autres sont en Wi-Fi) : même liste que dans genere_noeuds.py
          lora: "['thremise', 'thnomade', 'thcave']"
          wifi: "{{ capteur not in lora }}"
          # Nœuds Wi-Fi toujours éveillés sans « online » : commande non retenue (même liste que dans genere_noeuds.py)
          sans_retenu: "['prguirlande', 'noeud']"
          retenu: "{{ wifi and capteur not in sans_retenu }}"
          cmd: "{{ commande | trim }}"
          attente: "{{ states('sensor.' ~ capteur ~ '_commande_en_attente') }}"
      - if:
          - condition: template
            value_template: "{{ cmd == '' }}"
        then:
          - stop: "Commande vide"
      - if:
          - condition: template
            value_template: >-
              {{ cmd | upper != 'ANNULER' and attente not in ['aucune', 'unknown', 'unavailable', ''] }}
        then:
          - action: persistent_notification.create
            data:
              title: "Nœud {{ capteur }}"
              message: >-
                Commande « {{ cmd }} » refusée : « {{ attente }} » est déjà en attente.
                Annulez-la d'abord, ou attendez le prochain réveil du nœud.
          - stop: "Une commande est déjà en attente"
      - action: mqtt.publish
        data:
          topic: "home/conf{{ capteur }}/command"
          payload: "{{ '' if wifi and cmd | upper == 'ANNULER' else cmd }}"
          retain: "{{ retenu }}"

  # ------------------------------------------------------------
  # Efface le message retenu du topic command (commande restée en retenu, ancien testament « <nom> offline »...)
  # Sans effet sur la file du relais (il ignore un message vide).
  # ------------------------------------------------------------
  noeud_nettoyer_retenu:
    alias: Nœud capteur - Nettoyer le message retenu
    icon: mdi:broom
    mode: queued
    fields:
      capteur:
        name: Nœud
        description: Identifiant du nœud (thremise, thchrdc...)
        required: true
        example: thchrdc
        selector:
          text:
    sequence:
      - action: mqtt.publish
        data:
          topic: "home/conf{{ capteur }}/command"
          payload: ""
          retain: true

  # ------------------------------------------------------------
  # Un seul SET avec les réglages qui diffèrent de la dernière config reçue
  # ------------------------------------------------------------
  noeud_enregistrer:
    alias: Nœud capteur - Enregistrer les réglages
    icon: mdi:content-save
    mode: queued
    fields:
      capteur:
        name: Nœud
        description: Identifiant du nœud (thremise, thchrdc...)
        required: true
        example: thchrdc
        selector:
          text:
    sequence:
      - variables:
          cfg: "sensor.{{ capteur }}_config"
          params: >-
            {%- set ns = namespace(s='') -%}
            {%- set a = 1 if is_state('input_boolean.' ~ capteur ~ '_sleepa', 'on') else 0 -%}
            {%- if a != state_attr(cfg, 'sleepA') -%}{%- set ns.s = ns.s ~ ' sleepA:' ~ a -%}{%- endif -%}
            {#- mute : seulement si le firmware le connaît (présent dans la dernière config reçue) -#}
            {%- set m = 1 if is_state('input_boolean.' ~ capteur ~ '_mute', 'on') else 0 -%}
            {%- if state_attr(cfg, 'mute') is not none and m != state_attr(cfg, 'mute') -%}{%- set ns.s = ns.s ~ ' mute:' ~ m -%}{%- endif -%}
            {%- for k in ['sleepI', 'sleepS', 'sleepM', 'sleepL', 'wakeI'] -%}
              {%- set v = states('input_number.' ~ capteur ~ '_' ~ k | lower) | float(0) | int -%}
              {%- if v > 0 and v != state_attr(cfg, k) -%}{%- set ns.s = ns.s ~ ' ' ~ k ~ ':' ~ v -%}{%- endif -%}
            {%- endfor -%}
            {#- Forçages et délais d'alerte : seulement ceux de la dernière config reçue et dont le champ existe ;
                 délai 0 permis (au plus tôt), forçage de 60 s au moins -#}
            {%- for k in ['bat_alerte', 'bat_force', 'jn_alerte', 'jn_force', 'mfv_alerte', 'mfv_force', 'rgb_alerte', 'rgb_force', 'thhum_alerte', 'thhum_force'] -%}
              {%- if state_attr(cfg, k) is not none and states('input_number.' ~ capteur ~ '_' ~ k) not in ['unknown', 'unavailable'] -%}
                {%- set v = states('input_number.' ~ capteur ~ '_' ~ k) | float(-1) | int -%}
                {%- if v >= 0 and v != state_attr(cfg, k) -%}{%- set ns.s = ns.s ~ ' ' ~ k ~ ':' ~ v -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.s | trim -}}
          # Réglages trop courts (faute de frappe, champs restés au minimum) : 10 s au moins
          trop_courts: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for k in ['sleepI', 'sleepS', 'sleepM', 'sleepL', 'wakeI'] -%}
              {%- if states('input_number.' ~ capteur ~ '_' ~ k | lower) | float(0) < 10 -%}{%- set ns.l = ns.l + [k] -%}{%- endif -%}
            {%- endfor -%}
            {{- ns.l | join(', ') -}}
      # Sans config reçue, les champs ne reflètent pas le nœud (valeur minimale à la création) : envoi refusé
      - if:
          - condition: template
            value_template: "{{ state_attr(cfg, 'sleepI') is none }}"
        then:
          - action: persistent_notification.create
            data:
              title: "Nœud {{ capteur }}"
              message: >-
                Config du nœud inconnue : cliquez d'abord sur « Relire » et attendez son réveil,
                les réglages se rempliront avec ses vraies valeurs.
          - stop: "Config inconnue"
      - if:
          - condition: template
            value_template: "{{ trop_courts != '' }}"
        then:
          - action: persistent_notification.create
            data:
              title: "Nœud {{ capteur }}"
              message: "Envoi refusé : durée inférieure à 10 s pour {{ trop_courts }}."
          - stop: "Durée trop courte"
      - if:
          - condition: template
            value_template: "{{ params == '' }}"
        then:
          - action: persistent_notification.create
            data:
              title: "Nœud {{ capteur }}"
              message: "Aucun réglage modifié : rien à envoyer."
          - stop: "Aucune modification"
      - action: script.noeud_commande
        data:
          capteur: "{{ capteur }}"
          commande: "SET {{ params }}"

  # ------------------------------------------------------------
  # Envoie la commande libre saisie dans input_text.<nœud>_commande, puis vide le champ
  # ------------------------------------------------------------
  noeud_commande_libre:
    alias: Nœud capteur - Envoyer la commande libre
    icon: mdi:console
    mode: queued
    fields:
      capteur:
        name: Nœud
        description: Identifiant du nœud (thremise, thchrdc...)
        required: true
        example: thchrdc
        selector:
          text:
    sequence:
      - variables:
          cmd: "{{ states('input_text.' ~ capteur ~ '_commande') }}"
      - action: script.noeud_commande
        data:
          capteur: "{{ capteur }}"
          commande: "{{ cmd }}"
      - action: input_text.set_value
        target:
          entity_id: "input_text.{{ capteur }}_commande"
        data:
          value: ""

automation:
  # ------------------------------------------------------------
  # Config reçue du nœud : recopiée dans les réglages (input_boolean / input_number)
  # ------------------------------------------------------------
  - id: capteurs_lora_synchro_reglages
    alias: Nœuds capteurs - Recopier la config reçue dans les réglages
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - sensor.thremise_config
          - sensor.thnomade_config
          - sensor.thcave_config
          - sensor.thchrdc_config
          - sensor.thch1er_config
          - sensor.thsdb_config
          - sensor.prguirlande_config
    actions:
      - variables:
          capteur: "{{ trigger.entity_id.split('.')[1] | replace('_config', '') }}"
      - if:
          - condition: template
            value_template: "{{ state_attr(trigger.entity_id, 'sleepA') is not none }}"
        then:
          - action: >-
              input_boolean.turn_{{ 'on' if state_attr(trigger.entity_id, 'sleepA') == 1 else 'off' }}
            target:
              entity_id: "input_boolean.{{ capteur }}_sleepa"
      - if:
          - condition: template
            value_template: "{{ state_attr(trigger.entity_id, 'mute') is not none }}"
        then:
          - action: >-
              input_boolean.turn_{{ 'on' if state_attr(trigger.entity_id, 'mute') == 1 else 'off' }}
            target:
              entity_id: "input_boolean.{{ capteur }}_mute"
      - repeat:
          for_each: ["sleepI", "sleepS", "sleepM", "sleepL", "wakeI"]
          sequence:
            - if:
                - condition: template
                  value_template: "{{ state_attr(trigger.entity_id, repeat.item) is number }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.{{ capteur }}_{{ repeat.item | lower }}"
                  data:
                    value: "{{ state_attr(trigger.entity_id, repeat.item) }}"
      # Forçages et délais d'alerte, si le nœud les envoie et que le champ existe
      - repeat:
          for_each: ['bat_alerte', 'bat_force', 'jn_alerte', 'jn_force', 'mfv_alerte', 'mfv_force', 'rgb_alerte', 'rgb_force', 'thhum_alerte', 'thhum_force']
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ state_attr(trigger.entity_id, repeat.item) is number
                       and states('input_number.' ~ capteur ~ '_' ~ repeat.item) not in ['unknown', 'unavailable'] }}
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.{{ capteur }}_{{ repeat.item }}"
                  data:
                    value: "{{ state_attr(trigger.entity_id, repeat.item) }}"

  # ------------------------------------------------------------
  # Capteur en retard / revenu (home/alerte/<capteur>, publié par le CYD principal) : mail.
  # Déclenché par le changement d'état (pas par le message MQTT) : le message retenu relu au redémarrage de HA
  # ne renvoie pas de mail.
  # ------------------------------------------------------------
  - id: capteurs_alerte_retard_mail
    alias: Capteurs - Mail capteur en retard ou revenu
    description: Délai d'alerte dépassé (Capteur 3.9, Home-Assist 3.9)
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.thremise_en_retard
          - binary_sensor.batremise_en_retard
          - binary_sensor.flotteurremise_en_retard
          - binary_sensor.thnomade_en_retard
          - binary_sensor.batnomade_en_retard
          - binary_sensor.flotteurnomade_en_retard
          - binary_sensor.thcave_en_retard
          - binary_sensor.batcave_en_retard
          - binary_sensor.jncave_en_retard
          - binary_sensor.thchrdc_en_retard
          - binary_sensor.batchrdc_en_retard
          - binary_sensor.thch1er_en_retard
          - binary_sensor.batch1er_en_retard
          - binary_sensor.thsdb_en_retard
          - binary_sensor.batsdb_en_retard
          - binary_sensor.coulsdb_en_retard
          - binary_sensor.thcyd_en_retard
        to: "on"
        not_from:
          - "on"
          - "unavailable"
      - trigger: state
        entity_id:
          - binary_sensor.thremise_en_retard
          - binary_sensor.batremise_en_retard
          - binary_sensor.flotteurremise_en_retard
          - binary_sensor.thnomade_en_retard
          - binary_sensor.batnomade_en_retard
          - binary_sensor.flotteurnomade_en_retard
          - binary_sensor.thcave_en_retard
          - binary_sensor.batcave_en_retard
          - binary_sensor.jncave_en_retard
          - binary_sensor.thchrdc_en_retard
          - binary_sensor.batchrdc_en_retard
          - binary_sensor.thch1er_en_retard
          - binary_sensor.batch1er_en_retard
          - binary_sensor.thsdb_en_retard
          - binary_sensor.batsdb_en_retard
          - binary_sensor.coulsdb_en_retard
          - binary_sensor.thcyd_en_retard
        from: "on"
        to: "off"
    conditions:
      # Mode maintenance (Capteur 4.9) : pas de mail pendant la maintenance du nœud (téléversement, redémarrages) ;
      # à la sortie, mail si le capteur est toujours en retard (automatisation noeuds_maintenance_etat)
      - condition: template
        value_template: >-
          {%- set noeuds = {'thremise': 'thremise', 'batremise': 'thremise', 'flotteurremise': 'thremise', 'thcave': 'thcave', 'batcave': 'thcave', 'jncave': 'thcave', 'thchrdc': 'thchrdc', 'batchrdc': 'thchrdc', 'thch1er': 'thch1er', 'batch1er': 'thch1er', 'thsdb': 'thsdb', 'batsdb': 'thsdb', 'coulsdb': 'thsdb'} -%}
          {%- set c = trigger.entity_id.split('.')[1] | replace('_en_retard', '') -%}
          {{ c not in noeuds or not is_state('sensor.' ~ noeuds[c] ~ '_maintenance', 'ACTIVE') }}
    actions:
      - variables:
          capteur: "{{ trigger.to_state.name | replace(' En retard', '') }}"
          le: "{{ trigger.to_state.attributes.le | default(now().strftime('%d/%m/%Y %H:%M:%S')) }}"
          date: "{{ le.split(' ')[0] }}"
          heure: "{{ (le.split(' ') + [''])[1][:5] }}"
      - action: notify.email_kebir
        data:
          title: >-
            {{ '⚠️ ' ~ capteur ~ ' : plus de nouvelles' if trigger.to_state.state == 'on'
               else '✅ ' ~ capteur ~ ' : de retour' }}
          message: >-
            {%- if trigger.to_state.state == 'on' -%}
            ⚠ {{ capteur }} : aucune nouvelle depuis le {{ date }} à {{ heure }} (délai d'alerte dépassé).
            {%- else -%}
            ✅ {{ capteur }} : de nouveau des nouvelles ({{ date }} à {{ heure }}).
            {%- endif -%}


  # ------------------------------------------------------------
  # Mode maintenance : ordre au nœud.
  # Wi-Fi (Capteur 4.9) : publié RETENU sur home/conf<id>/maintenance (lu à son réveil). Interrupteur allumé : heure de
  # fin = maintenant + durée (au plus 120 min, plafond du nœud aussi), « ON AAAA-MM-JJ HH:MM » ;
  # éteint : « OFF ». À l'échéance (ou au démarrage de HA si elle est passée) : éteint. Le nœud sort seul à l'heure de
  # fin, même sans le OFF.
  # LoRa (Capteur 5.0) : « MAINTENANCE <min> » par la file du relais (refusé si une commande y attend déjà) ; rien à
  # l'échéance (le nœud compte depuis son entrée, sort seul et envoie INACTIVE, qui éteint l'interrupteur) ; interrupteur
  # éteint à la main : « MAINTENANCE OFF » s'il est en maintenance (🔧), ANNULER si l'ordre attend encore dans la file
  # (⏳), rien sinon (extinction après INACTIVE / REFUSEE / abandon) : pas de commande inutile qui bloquerait la file.
  # ------------------------------------------------------------
  - id: noeuds_maintenance_ordre
    alias: Nœuds Wi-Fi - Mode maintenance (ordre au nœud)
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.thremise_maintenance
          - input_boolean.thcave_maintenance
          - input_boolean.thchrdc_maintenance
          - input_boolean.thch1er_maintenance
          - input_boolean.thsdb_maintenance
        from: "off"
        to: "on"
        id: debut
      - trigger: state
        entity_id:
          - input_boolean.thremise_maintenance
          - input_boolean.thcave_maintenance
          - input_boolean.thchrdc_maintenance
          - input_boolean.thch1er_maintenance
          - input_boolean.thsdb_maintenance
        from: "on"
        to: "off"
        id: fin
      - trigger: time
        at:
          - input_datetime.thchrdc_maintenance_fin
          - input_datetime.thch1er_maintenance_fin
          - input_datetime.thsdb_maintenance_fin
        id: echeance
      - trigger: homeassistant
        event: start
        id: demarrage
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: debut
            sequence:
              - variables:
                  capteur: "{{ trigger.entity_id.split('.')[1] | replace('_maintenance', '') }}"
                  duree: >-
                    {{ [[states('input_number.' ~ capteur ~ '_maintenance_duree') | int(30), 1] | max, 120] | min }}
                  fin: "{{ (now() + timedelta(minutes=duree | int)).strftime('%Y-%m-%d %H:%M') }}"
                  # Nœuds LoRa : même liste que dans genere_noeuds.py
                  lora: "['thremise', 'thnomade', 'thcave']"
                  attente: "{{ states('sensor.' ~ capteur ~ '_commande_en_attente') }}"
              - if:
                  - condition: template
                    value_template: "{{ capteur in lora }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ attente not in ['aucune', 'unknown', 'unavailable', ''] }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "❌ Maintenance de {{ capteur }} non envoyée"
                          message: >-
                            « {{ attente }} » attend déjà dans la file du relais. Annulez-la, ou attendez le
                            prochain réveil du nœud, puis rallumez l'interrupteur Maintenance.
                          notification_id: "maintenance_{{ capteur }}"
                      - action: input_boolean.turn_off
                        target:
                          entity_id: "input_boolean.{{ capteur }}_maintenance"
                    else:
                      - action: script.noeud_commande
                        data:
                          capteur: "{{ capteur }}"
                          commande: "MAINTENANCE {{ duree }}"
                  - stop: "Nœud LoRa : ordre confié au relais"
              - action: input_datetime.set_datetime
                target:
                  entity_id: "input_datetime.{{ capteur }}_maintenance_fin"
                data:
                  datetime: "{{ fin }}:00"
              - action: mqtt.publish
                data:
                  topic: "home/conf{{ capteur }}/maintenance"
                  payload: "ON {{ fin }}"
                  retain: true
          - conditions:
              - condition: trigger
                id: fin
            sequence:
              - variables:
                  capteur: "{{ trigger.entity_id.split('.')[1] | replace('_maintenance', '') }}"
                  lora: "['thremise', 'thnomade', 'thcave']"
                  attente: "{{ states('sensor.' ~ capteur ~ '_commande_en_attente') | upper }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ capteur not in lora }}"
                    sequence:
                      - action: mqtt.publish
                        data:
                          topic: "home/conf{{ capteur }}/maintenance"
                          payload: "OFF"
                          retain: true
                  - conditions:
                      - condition: template
                        value_template: "{{ is_state('sensor.' ~ capteur ~ '_maintenance', 'ACTIVE') }}"
                    sequence:
                      - action: script.noeud_commande
                        data:
                          capteur: "{{ capteur }}"
                          commande: "MAINTENANCE OFF"
                  - conditions:
                      - condition: template
                        value_template: "{{ attente.startswith('MAINTENANCE') }}"
                    sequence:
                      - action: script.noeud_commande
                        data:
                          capteur: "{{ capteur }}"
                          commande: "ANNULER"
          - conditions:
              - condition: trigger
                id: echeance
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: "input_boolean.{{ trigger.entity_id.split('.')[1] | replace('_maintenance_fin', '') }}_maintenance"
          - conditions:
              - condition: trigger
                id: demarrage
            sequence:
              - repeat:
                  for_each: ['thchrdc', 'thch1er', 'thsdb']
                  sequence:
                    - if:
                        - condition: template
                          value_template: >-
                            {{ is_state('input_boolean.' ~ repeat.item ~ '_maintenance', 'on')
                               and as_timestamp(states('input_datetime.' ~ repeat.item ~ '_maintenance_fin'), 0) <= as_timestamp(now()) }}
                      then:
                        - action: input_boolean.turn_off
                          target:
                            entity_id: "input_boolean.{{ repeat.item }}_maintenance"

  # ------------------------------------------------------------
  # Mode maintenance : état publié par le nœud (sensor.<id>_maintenance) → notification ; sortie → interrupteur éteint
  # (efface l'ordre retenu) et mail des capteurs toujours en retard (mails suspendus pendant la maintenance) ;
  # refus (format, heure du nœud) → interrupteur éteint
  # ------------------------------------------------------------
  - id: noeuds_maintenance_etat
    alias: Nœuds Wi-Fi - Mode maintenance (notification)
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - sensor.thremise_maintenance
          - sensor.thcave_maintenance
          - sensor.thchrdc_maintenance
          - sensor.thch1er_maintenance
          - sensor.thsdb_maintenance
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state != trigger.from_state.state }}
    actions:
      - variables:
          capteur: "{{ trigger.entity_id.split('.')[1] | replace('_maintenance', '') }}"
          nom: "{{ trigger.to_state.name | replace(' Maintenance', '') }}"
          etat: "{{ trigger.to_state.state }}"
          message: "{{ trigger.to_state.attributes.message | default('') }}"
          retards: >-
            {%- set r = {'thremise': ['binary_sensor.thremise_en_retard', 'binary_sensor.batremise_en_retard', 'binary_sensor.flotteurremise_en_retard'], 'thcave': ['binary_sensor.thcave_en_retard', 'binary_sensor.batcave_en_retard', 'binary_sensor.jncave_en_retard'], 'thchrdc': ['binary_sensor.thchrdc_en_retard', 'binary_sensor.batchrdc_en_retard'], 'thch1er': ['binary_sensor.thch1er_en_retard', 'binary_sensor.batch1er_en_retard'], 'thsdb': ['binary_sensor.thsdb_en_retard', 'binary_sensor.batsdb_en_retard', 'binary_sensor.coulsdb_en_retard']} -%}
            {{ r.get(capteur, []) | select('is_state', 'on') | map('state_attr', 'friendly_name')
               | map('replace', ' En retard', '') | list }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ etat == 'ACTIVE' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "🔧 {{ nom }} en maintenance"
                  message: "{{ message | replace('ACTIVE ', '') }}"
                  notification_id: "maintenance_{{ capteur }}"
          - conditions:
              - condition: template
                value_template: "{{ etat == 'INACTIVE' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  # LoRa (Capteur 5.0) : « INACTIVE abandon : <raison> » si la reprise après un redémarrage a échoué
                  title: >-
                    {{ '⚠️ ' ~ nom ~ ' : maintenance abandonnée' if ' abandon' in message
                       else '✅ ' ~ nom ~ ' : fin de maintenance' }}
                  message: >-
                    {%- if ' abandon' in message -%}
                    {{ message | regex_replace('^INACTIVE abandon : ', '') }} ({{ now().strftime('%d/%m/%Y %H:%M') }}) ; {{ nom }} reprend son sommeil normal.
                    {%- else -%}
                    {{ nom }} a quitté la maintenance ({{ now().strftime('%d/%m/%Y %H:%M') }}) et reprend son sommeil normal.
                    {%- endif -%}
                    {%- if retards %} ⚠ Toujours sans nouvelles : {{ retards | join(', ') }}.{%- endif %}
                  notification_id: "maintenance_{{ capteur }}"
              - if:
                  - condition: template
                    value_template: "{{ is_state('input_boolean.' ~ capteur ~ '_maintenance', 'on') }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "input_boolean.{{ capteur }}_maintenance"
              - if:
                  - condition: template
                    value_template: "{{ retards | count > 0 }}"
                then:
                  - action: notify.email_kebir
                    data:
                      title: "⚠️ {{ retards | join(', ') }} : plus de nouvelles (fin de maintenance de {{ nom }})"
                      message: >-
                        ⚠ {{ retards | join(', ') }} : toujours en retard à la fin de la maintenance de {{ nom }}
                        ({{ now().strftime('%d/%m/%Y %H:%M') }}) ; mail suspendu pendant la maintenance.
          - conditions:
              - condition: template
                value_template: "{{ etat == 'REFUSEE' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "❌ {{ nom }} : maintenance refusée"
                  message: "{{ message | replace('REFUSEE ', '') }}"
                  notification_id: "maintenance_{{ capteur }}"
              - action: input_boolean.turn_off
                target:
                  entity_id: "input_boolean.{{ capteur }}_maintenance"


  # ------------------------------------------------------------
  # Mise à jour du firmware à distance : notification à chaque étape, mail du résultat (OK, ECHEC, RETOUR)
  # Déclenchée par un changement du message (pas par sa relecture au redémarrage de HA : même message, rien ne change)
  # ------------------------------------------------------------
  - id: firmware_mise_a_jour_notification
    alias: Firmware - Mise à jour à distance (notification et mail)
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - sensor.relaislora_mise_a_jour_firmware
          - sensor.configuration_mise_a_jour_firmware
          - sensor.configaux_mise_a_jour_firmware
          - sensor.configaux2_mise_a_jour_firmware
          - sensor.thchrdc_mise_a_jour_firmware
          - sensor.thch1er_mise_a_jour_firmware
          - sensor.thsdb_mise_a_jour_firmware
          - sensor.thremise_mise_a_jour_firmware
          - sensor.thcave_mise_a_jour_firmware
          - sensor.noeud_mise_a_jour_firmware
          - sensor.prguirlande_mise_a_jour_firmware
        attribute: message
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.attributes.message is defined }}
    actions:
      - variables:
          appareil: "{{ trigger.to_state.attributes.appareil }}"
          etape: "{{ trigger.to_state.state }}"
          message: "{{ trigger.to_state.attributes.message }}"
          icone: >-
            {{ {'OK': '✅', 'ECHEC': '❌', 'RETOUR': '↩️', 'DEBUT': '⏳', 'TRANSFERT': '⏳', 'ATTENTE': '🔧'}.get(etape, 'ℹ️') }}
          libelle: >-
            {{ {'OK': 'mise à jour réussie', 'ECHEC': 'mise à jour refusée ou échouée',
                 'RETOUR': 'retour au firmware précédent', 'DEBUT': 'mise à jour commencée',
                 'TRANSFERT': 'firmware reçu, redémarrage',
                 'ATTENTE': 'prêt pour une mise à jour'}.get(etape, etape) }}
      - action: persistent_notification.create
        data:
          title: "{{ icone }} {{ appareil }} : {{ libelle }}"
          message: "{{ message }}"
      - if:
          - condition: template
            value_template: "{{ etape in ['OK', 'ECHEC', 'RETOUR'] }}"
        then:
          - action: notify.email_kebir
            data:
              title: "{{ icone }} {{ appareil }} : {{ libelle }}"
              message: "{{ icone }} {{ appareil }} : {{ libelle }}. Détail : {{ message }}"

  # ------------------------------------------------------------
  # Appareils RF vérifiés par un nœud de présence : notification quand le CYD principal signale un échec
  # (« <nom> ECHEC ON|OFF <essais> » sur home/<appareil>/state, Home-Assist 3.6)
  # ------------------------------------------------------------
  - id: appareils_rf_echec_commande
    alias: Appareils RF - Échec de commande (nœud de présence)
    description: Le CYD principal n'a pas atteint l'état voulu après N envois du code (Home-Assist 3.6)
    mode: queued
    triggers:
      - trigger: mqtt
        topic: "home/+/state"
        value_template: "{{ 'oui' if value.split(' ')[1:2] == ['ECHEC'] else 'non' }}"
        payload: "oui"
    actions:
      - variables:
          m: "{{ trigger.payload.split(' ') }}"
          message: >-
            {{ m[0] }} : commande {{ m[2] if m | count > 2 else '?' }} non réalisée après
            {{ m[3] if m | count > 3 else '?' }} essais ({{ now().strftime('%d/%m/%Y %H:%M') }}).
            Vérifier la prise RF et le nœud de présence.
      - action: persistent_notification.create
        data:
          title: "{{ m[0] }} : échec de commande"
          message: "{{ message }}"
          notification_id: "echec_{{ m[0] | lower }}"

  # ------------------------------------------------------------
  # Nœuds Wi-Fi : efface la commande retenue dès que le nœud l'a reçue, c.-à-d. à son accusé
  # (« <nom> COMMANDE reçue ... ») ou à sa connexion (« <nom> online le ... », publié APRÈS ses abonnements :
  # la commande retenue lui est déjà remise). Évite qu'elle soit rejouée à chaque réveil (REBOOT en boucle).
  # ------------------------------------------------------------
  - id: noeuds_wifi_effacer_commande_retenue
    alias: Nœuds Wi-Fi - Effacer la commande retenue
    mode: queued
    triggers:
      # home/+/state couvre home/thermometre/state (« online ») et home/conf<id>/state (accusé) ;
      # filtré dans le déclencheur pour ne pas lancer l'automatisation à chaque mesure
      - trigger: mqtt
        topic: "home/+/state"
        value_template: >-
          {{ 'oui' if (' COMMANDE reçue ' in value or ' online le ' in value) else 'non' }}
        payload: "oui"
    variables:
      # Nœuds Wi-Fi : même liste que dans genere_noeuds.py
      wifi: "['thchrdc', 'thch1er', 'thsdb', 'prguirlande', 'noeud']"
      capteur: "{{ (trigger.payload.split(' ') + [''])[0] | lower }}"
    conditions:
      - condition: template
        value_template: >-
          {{ capteur in wifi
             and states('sensor.' ~ capteur ~ '_commande_en_attente') not in ['aucune', 'unknown', 'unavailable', ''] }}
    actions:
      - action: mqtt.publish
        data:
          topic: "home/conf{{ capteur }}/command"
          payload: ""
          retain: true
