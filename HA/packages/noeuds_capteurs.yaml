# ============================================================
# PACKAGE : NŒUDS CAPTEURS - pilotage à distance des nœuds (LoRa et Wi-Fi)
# Généré par genere_noeuds.py : modifier la liste NOEUDS du générateur plutôt que ce fichier.
#
# Un nœud = une carte (un suffixe : Remise, Cave, ChRDC...) portant plusieurs capteurs unitaires
# (Th<Suffixe>, Bat<Suffixe>, Flotteur<Suffixe>...). Identifiant du nœud : th<suffixe> (ex. thchrdc).
#
# Topics : home/conf<id>/command  commandes
#          home/conf<id>/state    réponses du nœud (CONFIG, ETAT, accusés « COMMANDE reçue »)
#          home/conf<id>/attente  LoRa : commande en attente dans le relais (retenu, publié par le relais)
# File d'attente : LoRa = le relais (envoi au prochain réveil) ;
#                  Wi-Fi = commande publiée en RETENU, effacée par HA à l'accusé ou à la connexion (« online »).
# Entités : sensor.<id>_config (attributs sleepA, sleepI, sleepS, sleepM, sleepL, wakeI, erreur)
#           sensor.<id>_rapport (réponse STATUS), sensor.<id>_commande_en_attente
#           sensor.<id>_derniere_trame, binary_sensor.<id>_eveille
#           sensor.<id>_version (firmware, trame « <nom> VERSION 3.4 31/10/2026 13:13 » : Capteur 3.4),
#           sensor.relaislora_version (Relais-Lora 2.3), binary_sensor.relaislora_connexion,
#           sensor.relaislora_dernier_signal, sensor.relaislora_testament, sensor.relaislora_etat (réponse STATUS,
#           attribut texte) : vue Relais LoRa ; connexion = signal de moins de 3 min (ALIVE toutes les 60 s)
#           input_boolean.<id>_sleepa, input_number.<id>_sleepi / _sleeps / _sleepm / _sleepl / _wakei
#           input_text.<id>_commande (commande libre)
#           Délai d'alerte : input_number.<id>_<préfixe>_alerte (min, Capteur 4.4) de chaque capteur : thhum, bat, mfv,
#           jn, rgb ; attributs de même nom de sensor.<id>_config,
#           binary_sensor.<capteur>_en_retard (home/alerte/<capteur>, publié par le CYD principal ; attribut « le »),
#           automatisation « Capteurs - Mail capteur en retard ou revenu »
#           Mode maintenance (Capteur 4.9 Wi-Fi, 5.0 LoRa) : input_boolean.<id>_maintenance,
#           input_number.<id>_maintenance_duree (min), input_datetime.<id>_maintenance_fin (Wi-Fi), sensor.<id>_maintenance
#           (home/conf<id>/maintenance/etat) ; ordre retenu sur home/conf<id>/maintenance (Wi-Fi) ou commande
#           MAINTENANCE par la file du relais (LoRa)
# Les commandes sont décrites dans Doc/mqtt.docx § 3.2 (et l'aide « ? » de la page du relais).
# ============================================================

# Pas de bloc « mqtt: » ici : il est déjà un dictionnaire dans configuration.yaml (fusion de paquet refusée).
# Les capteurs MQTT sont donc des templates à déclencheur MQTT (comme packages/chauffage.yaml).
template:
  # ---------- ThRemise : commande en attente dans le relais (« STATUS (envoi 1/10) » ou « aucune », retenu) ----------
  - trigger:
      - trigger: mqtt
        topic: "home/confthremise/attente"
    sensor:
      - name: "ThRemise Commande en attente"
        unique_id: thremise_commande_attente
        icon: mdi:timer-sand
        state: "{{ trigger.payload[:255] }}"

  # ---------- ThRemise : réponse CONFIG (« ThRemise CONFIG sleepA:1 sleepI:30 ... [ERREUR cle:val] <IP> ») ----------
  # LoRa (Capteur 3.9) : config trop longue pour une trame → « ThRemise CONFIG ... » puis « ThRemise CONFIGSUITE ... » ;
  # une trame CONFIGSUITE ne change que les attributs qu'elle contient (les autres gardent la valeur précédente),
  # une trame CONFIG remet à none ceux qu'elle ne contient pas. ERREUR est toujours dans la dernière trame.
  - trigger:
      - trigger: mqtt
        topic: "home/confthremise/state"
        value_template: "{{ (value.split(' ') + [''])[1] | upper }}"
        payload: "CONFIG"
      - trigger: mqtt
        topic: "home/confthremise/state"
        value_template: "{{ (value.split(' ') + [''])[1] | upper }}"
        payload: "CONFIGSUITE"
    sensor:
      - name: "ThRemise Config"
        unique_id: thremise_config
        device_class: timestamp
        icon: mdi:cog
        state: "{{ now().isoformat() }}"
        attributes:
          sleepA: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' sleepA:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('sleepA') if suite else none) }}
          sleepI: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' sleepI:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('sleepI') if suite else none) }}
          sleepC: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' sleepC:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('sleepC') if suite else none) }}
          sleepS: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' sleepS:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('sleepS') if suite else none) }}
          sleepM: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' sleepM:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('sleepM') if suite else none) }}
          sleepL: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' sleepL:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('sleepL') if suite else none) }}
          wakeI: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' wakeI:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('wakeI') if suite else none) }}
          mute: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' mute:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('mute') if suite else none) }}
          mfv_rev: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' mfv_rev:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('mfv_rev') if suite else none) }}
          mfv_revmin: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' mfv_revmin:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('mfv_revmin') if suite else none) }}
          mfv_ack: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' mfv_ack:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('mfv_ack') if suite else none) }}
          mfv_ackn: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' mfv_ackn:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('mfv_ackn') if suite else none) }}
          thhum_force: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' thhum_force:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('thhum_force') if suite else none) }}
          thhum_alerte: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' thhum_alerte:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('thhum_alerte') if suite else none) }}
          bat_force: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' bat_force:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('bat_force') if suite else none) }}
          bat_alerte: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' bat_alerte:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('bat_alerte') if suite else none) }}
          mfv_force: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' mfv_force:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('mfv_force') if suite else none) }}
          mfv_alerte: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' mfv_alerte:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('mfv_alerte') if suite else none) }}
          erreur: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set p = trigger.payload.split(' ERREUR ') -%}
            {{ p[1] | regex_replace(' \d{1,3}(\.\d{1,3}){3}$', '') if p | length > 1
               else (this.attributes.get('erreur', '') if suite else '') }}

  # ---------- ThRemise : réponse STATUS ----------
  # Wi-Fi et LoRa : une ligne « ThRemise ETAT <date> <heure> | [IP : <ip> | ]Wdog : ... | Uptime : ...s <IP> »
  # Ancien firmware Wi-Fi (avant Capteur 2.1) : plusieurs lignes « === ÉTAT ThRemise === » (remises sur une ligne, séparées par « | »)
  - trigger:
      - trigger: mqtt
        topic: "home/confthremise/state"
        value_template: >-
          {{ 'ETAT' if (value.split(' ') + [''])[1] | upper in ['ETAT', 'ÉTAT'] else '' }}
        payload: "ETAT"
    sensor:
      - name: "ThRemise Rapport"
        unique_id: thremise_rapport
        icon: mdi:information-outline
        state: >-
          {%- set p = trigger.payload -%}
          {%- if p.startswith('===') -%}
            {%- set s = p.split('\n')[1:] | map('trim') | reject('eq', '') | join(' | ') -%}
          {%- else -%}
            {%- set s = p.split(' ', 2)[2] -%}
          {%- endif -%}
          {{ (s | regex_replace(' {2,}', ' ') | regex_replace(' \d{1,3}(\.\d{1,3}){3}$', ''))[:255] }}
        attributes:
          recu: "{{ now().isoformat() }}"

  # ---------- ThRemise : activité (éveillé jusqu'à DEEPSLEEP ON, sans délai : même règle que les CYD) ----------
  - trigger:
      - trigger: mqtt
        topic: "home/thermometre/state"
        value_template: "{{ value.split(' ')[0] | upper }}"
        payload: "THREMISE"
      - trigger: mqtt
        topic: "home/thermometre/state"
        value_template: "{{ value.split(' ')[0] | upper }}"
        payload: "BATREMISE"
      - trigger: mqtt
        topic: "home/thermometre/state"
        value_template: "{{ value.split(' ')[0] | upper }}"
        payload: "FLOTTEURREMISE"
      - trigger: mqtt
        topic: "home/confthremise/state"
    binary_sensor:
      - name: "ThRemise Éveillé"
        unique_id: thremise_eveille
        icon: mdi:sleep-off
        state: >-
          {%- set p = trigger.payload | upper -%}
          {{ 'DEEPSLEEP ON' not in p and not p.endswith(' OFFLINE') }}
    sensor:
      - name: "ThRemise Dernière trame"
        unique_id: thremise_derniere_trame
        device_class: timestamp
        icon: mdi:access-point
        state: "{{ now().isoformat() }}"

  # ---------- ThRemise : version du firmware (au démarrage, pas au réveil d'un deep sleep, et après GET) ----------
  - trigger:
      - trigger: mqtt
        topic: "home/confthremise/state"
    conditions:
      - condition: template
        value_template: "{{ ' VERSION ' in trigger.payload }}"
    sensor:
      - name: "ThRemise Version"
        unique_id: thremise_version
        icon: mdi:chip
        state: "{{ trigger.payload.split(' VERSION ')[1].split(' ')[0] }}"
        attributes:
          compilation: >-
            {%- set w = trigger.payload.split(' VERSION ')[1].split(' ') -%}
            {{ (w[1] ~ ' ' ~ w[2]) if w | count > 2 else '' }}
          recu: "{{ now().isoformat() }}"

  # ---------- ThNomade : commande en attente dans le relais (« STATUS (envoi 1/10) » ou « aucune », retenu) ----------
  - trigger:
      - trigger: mqtt
        topic: "home/confthnomade/attente"
    sensor:
      - name: "ThNomade Commande en attente"
        unique_id: thnomade_commande_attente
        icon: mdi:timer-sand
        state: "{{ trigger.payload[:255] }}"

