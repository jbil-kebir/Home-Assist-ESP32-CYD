      - trigger: mqtt
        topic: "home/thermometre/state"
        value_template: "{{ value.split(' ')[0] | upper }}"
        payload: "THCAVE"
      - trigger: mqtt
        topic: "home/thermometre/state"
        value_template: "{{ value.split(' ')[0] | upper }}"
        payload: "BATCAVE"
      - trigger: mqtt
        topic: "home/thermometre/state"
        value_template: "{{ value.split(' ')[0] | upper }}"
        payload: "JNCAVE"
      - trigger: mqtt
        topic: "home/confthcave/state"
