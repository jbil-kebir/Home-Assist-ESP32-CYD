  # Ancien firmware Wi-Fi (avant Capteur 2.1) : plusieurs lignes « === ÉTAT ThCave === » (remises sur une ligne, séparées par « | »)
  - trigger:
      - trigger: mqtt
        topic: "home/confthcave/state"
        value_template: >-
          {{ 'ETAT' if (value.split(' ') + [''])[1] | upper in ['ETAT', 'ÉTAT'] else '' }}
        payload: "ETAT"
    sensor:
      - name: "ThCave Rapport"
        unique_id: thcave_rapport
        icon: mdi:information-outline
        state: >-
          {%- set p = trigger.payload -%}
          {%- if p.startswith('===') -%}
            {%- set s = p.split('\n')[1:] | map('trim') | reject('eq', '') | join(' | ') -%}
          {%- else -%}
            {%- set s = p.split(' ', 2)[2] -%}
          {%- endif -%}
          {{ (s | regex_replace(' {2,}', ' ') | regex_replace(' \d{1,3}(\.\d{1,3}){3}$', ''))[:255] }}
        attributes:
          recu: "{{ now().isoformat() }}"

  # ---------- ThCave : activité (éveillé jusqu'à DEEPSLEEP ON, sans délai : même règle que les CYD) ----------
