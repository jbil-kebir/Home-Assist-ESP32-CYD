        state: >-
          {%- set m = trigger.payload.split(' ') -%}
          {{ m[2] ~ ' non atteint après ' ~ m[3] ~ ' essais' if m | count > 3 else trigger.payload }}
        attributes:
          recu: "{{ now().isoformat() }}"
  - trigger:
      - trigger: mqtt
        topic: "home/guirlande/state"
    conditions:
      - condition: template
        value_template: "{{ trigger.payload.split(' ')[1:2] in [['NONVERIFIE'], ['VERIFIE']] }}"
    binary_sensor:
      - name: "Guirlande Non vérifiée"
        unique_id: guirlande_non_verifiee
        icon: mdi:help-circle
        state: "{{ trigger.payload.split(' ')[1] == 'NONVERIFIE' }}"
  # « <nom> VERIFICATION EN_COURS|FIN » (Home-Assist 3.6) : bouton de la vue Actionneurs remplacé par un sablier ;
  # retombe seul au bout de 2 min si la fin se perd (CYD redémarré...)
  - trigger:
      - trigger: mqtt
        topic: "home/guirlande/state"
    conditions:
      - condition: template
        value_template: "{{ trigger.payload.split(' ')[1:2] == ['VERIFICATION'] }}"
    binary_sensor:
      - name: "Guirlande Vérification en cours"
        unique_id: guirlande_verification_en_cours
        icon: mdi:timer-sand
        auto_off: 120
        state: "{{ trigger.payload.split(' ')[2:3] == ['EN_COURS'] }}"

  # ---------- Relais LoRa : connexion (dernier signal récent, pas de testament plus récent) ----------
  - binary_sensor:
      - name: "RelaisLora Connexion"
        unique_id: relaislora_connexion
        device_class: connectivity
        state: >-
          {%- if has_value('sensor.relaislora_dernier_signal') -%}
            {%- set d = as_datetime(states('sensor.relaislora_dernier_signal')) -%}
            {%- set t = as_datetime(states('sensor.relaislora_testament')) if has_value('sensor.relaislora_testament') else none -%}
            {{ (now() - d).total_seconds() < 180 and (t is none or t < d) }}
          {%- else -%}
            false
          {%- endif -%}

  # ---------- Relais LoRa : testament (connexion MQTT perdue) ----------
  - trigger:
      - trigger: mqtt
        topic: "home/confrelaislora/state"
    conditions:
      - condition: template
        value_template: "{{ ' - Reconnect le ' in trigger.payload }}"
    sensor:
      - name: "RelaisLora Testament"
        unique_id: relaislora_testament
        device_class: timestamp
        icon: mdi:lan-disconnect
        state: "{{ now().isoformat() }}"

  # ---------- Relais LoRa : dernier signal (ALIVE, toute autre trame du relais, trame LoRa relayée) ----------
  - trigger:
      - trigger: mqtt
        topic: "home/confrelaislora/state"
      - trigger: mqtt
        topic: "home/configuration/command"
        value_template: "{{ 'oui' if value.upper().startswith('DEVICE RELAIS LORA') else 'non' }}"
        payload: "oui"
      - trigger: mqtt
        topic: "home/thermometre/state"
        value_template: "{{ 'oui' if value.endswith(' 0.0.0.0') else 'non' }}"
        payload: "oui"
    conditions:
      - condition: template
        value_template: "{{ ' - Reconnect le ' not in trigger.payload }}"
    sensor:
      - name: "RelaisLora Dernier signal"
        unique_id: relaislora_dernier_signal
        device_class: timestamp
        icon: mdi:access-point
        state: "{{ now().isoformat() }}"

  # ---------- Relais LoRa : réponse au STATUS (« === ÉTAT <nom> === », version, IP, uptime, files d'attente) ----------
  - trigger:
      - trigger: mqtt
        topic: "home/confrelaislora/state"
    conditions:
      - condition: template
        value_template: "{{ trigger.payload.startswith('=== ') }}"
    sensor:
      - name: "RelaisLora État"
        unique_id: relaislora_etat
        device_class: timestamp
        icon: mdi:router-wireless
        state: "{{ now().isoformat() }}"
        attributes:
          texte: "{{ trigger.payload }}"

