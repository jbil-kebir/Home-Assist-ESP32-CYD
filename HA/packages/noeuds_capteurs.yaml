      - trigger: mqtt
        topic: "home/confnoeud/state"
    conditions:
      - condition: template
        value_template: "{{ ' VERSION ' in trigger.payload }}"
    sensor:
      - name: "Noeud Version"
        unique_id: noeud_version
        icon: mdi:chip
        state: "{{ trigger.payload.split(' VERSION ')[1].split(' ')[0] }}"
        attributes:
          compilation: >-
            {%- set w = trigger.payload.split(' VERSION ')[1].split(' ') -%}
            {{ (w[1] ~ ' ' ~ w[2]) if w | count > 2 else '' }}
          recu: "{{ now().isoformat() }}"

