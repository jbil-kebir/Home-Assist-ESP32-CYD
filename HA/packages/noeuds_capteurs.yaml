# ============================================================
# PACKAGE : NŒUDS CAPTEURS - pilotage à distance des nœuds (LoRa et Wi-Fi)
# Généré par genere_noeuds.py : modifier la liste NOEUDS du générateur plutôt que ce fichier.
#
# Un nœud = une carte (un suffixe : Remise, Cave, ChRDC...) portant plusieurs capteurs unitaires
# (Th<Suffixe>, Bat<Suffixe>, Flotteur<Suffixe>...). Identifiant du nœud : th<suffixe> (ex. thchrdc).
#
# Topics : home/conf<id>/command  commandes
#          home/conf<id>/state    réponses du nœud (CONFIG, ETAT, accusés « COMMANDE reçue »)
#          home/conf<id>/attente  LoRa : commande en attente dans le relais (retenu, publié par le relais)
# File d'attente : LoRa = le relais (envoi au prochain réveil) ;
#                  Wi-Fi = commande publiée en RETENU, effacée par HA à l'accusé ou à la connexion (« online »).
# Entités : sensor.<id>_config (attributs sleepA, sleepI, sleepS, sleepM, sleepL, wakeI, erreur)
#           sensor.<id>_rapport (réponse STATUS), sensor.<id>_commande_en_attente
#           sensor.<id>_derniere_trame, binary_sensor.<id>_eveille
#           input_boolean.<id>_sleepa, input_number.<id>_sleepi / _sleeps / _sleepm / _sleepl / _wakei
#           input_text.<id>_commande (commande libre)
# Les commandes sont décrites dans Doc/mqtt.docx § 3.2 (et l'aide « ? » de la page du relais).
# ============================================================

# Pas de bloc « mqtt: » ici : il est déjà un dictionnaire dans configuration.yaml (fusion de paquet refusée).
# Les capteurs MQTT sont donc des templates à déclencheur MQTT (comme packages/chauffage.yaml).
template:
  # ---------- ThRemise : commande en attente dans le relais (« STATUS (envoi 1/10) » ou « aucune », retenu) ----------
  - trigger:
      - trigger: mqtt
        topic: "home/confthremise/attente"
    sensor:
      - name: "ThRemise Commande en attente"
        unique_id: thremise_commande_attente
        icon: mdi:timer-sand
        state: "{{ trigger.payload[:255] }}"

  # ---------- ThRemise : réponse CONFIG (« ThRemise CONFIG sleepA:1 sleepI:30 ... [ERREUR cle:val] <IP> ») ----------
  - trigger:
      - trigger: mqtt
        topic: "home/confthremise/state"
        value_template: "{{ (value.split(' ') + [''])[1] | upper }}"
        payload: "CONFIG"
    sensor:
      - name: "ThRemise Config"
        unique_id: thremise_config
        device_class: timestamp
        icon: mdi:cog
        state: "{{ now().isoformat() }}"
        attributes:
          sleepA: >-
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall('sleepA:(\d+)') -%}
            {{ m[0] | int if m else none }}
          sleepI: >-
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall('sleepI:(\d+)') -%}
            {{ m[0] | int if m else none }}
          sleepS: >-
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall('sleepS:(\d+)') -%}
            {{ m[0] | int if m else none }}
          sleepM: >-
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall('sleepM:(\d+)') -%}
            {{ m[0] | int if m else none }}
          sleepL: >-
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall('sleepL:(\d+)') -%}
            {{ m[0] | int if m else none }}
          wakeI: >-
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall('wakeI:(\d+)') -%}
            {{ m[0] | int if m else none }}
          mute: >-
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall('mute:(\d+)') -%}
            {{ m[0] | int if m else none }}
          mfv_rev: >-
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall('mfv_rev:(\d+)') -%}
            {{ m[0] | int if m else none }}
          mfv_revmin: >-
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall('mfv_revmin:(\d+)') -%}
            {{ m[0] | int if m else none }}
          mfv_ack: >-
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall('mfv_ack:(\d+)') -%}
            {{ m[0] | int if m else none }}
          mfv_ackn: >-
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall('mfv_ackn:(\d+)') -%}
            {{ m[0] | int if m else none }}
          erreur: >-
            {%- set p = trigger.payload.split(' ERREUR ') -%}
            {{ p[1] | regex_replace(' \d{1,3}(\.\d{1,3}){3}$', '') if p | length > 1 else '' }}

  # ---------- ThRemise : réponse STATUS ----------
  # Wi-Fi et LoRa : une ligne « ThRemise ETAT <date> <heure> | [IP : <ip> | ]Wdog : ... | Uptime : ...s <IP> »
  # Ancien firmware Wi-Fi (avant Capteur 2.1) : plusieurs lignes « === ÉTAT ThRemise === » (remises sur une ligne, séparées par « | »)
  - trigger:
      - trigger: mqtt
        topic: "home/confthremise/state"
        value_template: >-
          {{ 'ETAT' if (value.split(' ') + [''])[1] | upper in ['ETAT', 'ÉTAT'] else '' }}
        payload: "ETAT"
    sensor:
      - name: "ThRemise Rapport"
        unique_id: thremise_rapport
        icon: mdi:information-outline
        state: >-
          {%- set p = trigger.payload -%}
          {%- if p.startswith('===') -%}
            {%- set s = p.split('\n')[1:] | map('trim') | reject('eq', '') | join(' | ') -%}
          {%- else -%}
            {%- set s = p.split(' ', 2)[2] -%}
          {%- endif -%}
          {{ (s | regex_replace(' {2,}', ' ') | regex_replace(' \d{1,3}(\.\d{1,3}){3}$', ''))[:255] }}
        attributes:
          recu: "{{ now().isoformat() }}"

  # ---------- ThRemise : activité (éveillé jusqu'à DEEPSLEEP ON ; auto_off si la trame de coucher est perdue) ----------
  - trigger:
      - trigger: mqtt
        topic: "home/thermometre/state"
        value_template: "{{ value.split(' ')[0] | upper }}"
        payload: "THREMISE"
      - trigger: mqtt
        topic: "home/thermometre/state"
        value_template: "{{ value.split(' ')[0] | upper }}"
        payload: "BATREMISE"
      - trigger: mqtt
        topic: "home/thermometre/state"
        value_template: "{{ value.split(' ')[0] | upper }}"
        payload: "FLOTTEURREMISE"
      - trigger: mqtt
        topic: "home/confthremise/state"
    binary_sensor:
      - name: "ThRemise Éveillé"
        unique_id: thremise_eveille
        icon: mdi:sleep-off
        state: >-
          {%- set p = trigger.payload | upper -%}
          {{ 'DEEPSLEEP ON' not in p and not p.endswith(' OFFLINE') }}
        auto_off: "00:01:00"
    sensor:
      - name: "ThRemise Dernière trame"
        unique_id: thremise_derniere_trame
        device_class: timestamp
        icon: mdi:access-point
        state: "{{ now().isoformat() }}"

