            {{ m[0] | int if m else (this.attributes.get('mute') if suite else none) }}
          thhum_force: >-
            {%- set suite = (trigger.payload.split(' ') + [''])[1] | upper == 'CONFIGSUITE' -%}
            {%- set m = trigger.payload.split(' ERREUR')[0] | regex_findall(' thhum_force:(\d+)') -%}
            {{ m[0] | int if m else (this.attributes.get('thhum_force') if suite else none) }}
          thhum_alerte: >-
