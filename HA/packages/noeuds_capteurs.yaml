          {{ 'DEEPSLEEP ON' not in p and not p.endswith(' OFFLINE') }}
    sensor:
      - name: "ThCave Dernière trame"
        unique_id: thcave_derniere_trame
        device_class: timestamp
        icon: mdi:access-point
        state: "{{ now().isoformat() }}"

