# ============================================================
# Package : Sommeil de ThSdb (capteur de la DEL de la chaudière)
#  - Boutons « Réveiller ThSdb » / « Endormir ThSdb » : vue Chaudière du tableau Accueil
#    (script.noeud_commande : SET sleepA:0 / SET sleepA:1, commande retenue lue au prochain réveil du nœud)
#  - Endormissement automatique : SET sleepA:1 quand, depuis au moins le délai réglé,
#      * la DEL de la chaudière est éteinte (sensor.coulsdb_del = Eteinte),
#      * le thermostat « Chaudière RDC » est à l'arrêt (climate.chaudiere_rdc = off),
#      * ThSdb n'a pas répondu CONFIG (réveil demandé, GET...) : évite de le rendormir juste après « Réveiller »,
#    seulement si ThSdb a le deep sleep inactif (sleepA = 0) et qu'aucune commande n'attend déjà.
#  - Réveil automatique : SET sleepA:0 à chaque demande d'allumage de la chaudière (ON, ON_FORCE, ONR)
#  - Délai : input_number.thsdb_delai_sommeil (minutes, 30 par défaut)
#  - sensor.thsdb_prochain_reveil : réveil estimé (trame DEEPSLEEP ON + durée annoncée), affiché sur la carte ThSdb
#  - sensor.thsdb_rssi : niveau de réception Wi-Fi (trames REVEIL et ALIVE), pour juger du passage en C3 sans LoRa
# ============================================================

input_number:
  thsdb_delai_sommeil:
    name: "ThSdb Délai avant endormissement"
    icon: mdi:timer-sand
    min: 5
    max: 240
    step: 5
    unit_of_measurement: min
    mode: box

template:
  # ---------- Prochain réveil estimé : heure de la trame DEEPSLEEP ON + durée annoncée ----------
  # Trame : « ThSdb DEEPSLEEP ON 01/11/2026 10:32:05 600 Durée éveil : 2441 ms » (durée = 6e mot, en s)
  - trigger:
      - trigger: mqtt
        topic: "home/thermometre/state"
        value_template: >-
          {%- set m = value.split(' ') -%}
          {{ 'ok' if m | length > 5 and m[0] | upper == 'THSDB' and m[1] | upper == 'DEEPSLEEP' and m[2] | upper == 'ON' else '' }}
        payload: "ok"
    sensor:
      - name: "ThSdb Prochain réveil"
        unique_id: thsdb_prochain_reveil
        device_class: timestamp
        icon: mdi:alarm
        state: >-
          {%- set d = trigger.payload.split(' ')[5] | int(0) -%}
          {{ (now() + timedelta(seconds=d)).isoformat() if d > 0 else none }}

  # ---------- Niveau de réception Wi-Fi de ThSdb (dBm) ----------
  # But : juger si un C3 en Wi-Fi seul suffit à cet emplacement (sans module LoRa).
  # Repère : > -67 dBm très bon, -67 à -75 correct, -75 à -80 limite, < -80 pertes probables.
  # Trames lues (home/thermometre/state, home/batt/state), des trois équipements du nœud (ThSdb, CoulSdb, BatSdb) :
  #   « ThSdb REVEIL DEEPSLEEP <date> <heure> 600 Cause réveil : … RSSI : -67 dBm Préc : … » (à chaque réveil)
  #   « CoulSdb ALIVE <date> <heure> RSSI -67 »                                         (si le watchdog ALIVE est actif)
  - trigger:
      - trigger: mqtt
        topic: "home/+/state"
        value_template: >-
          {%- set m = value.split(' ') -%}
          {{ 'ok' if m | length > 1 and m[0] | upper in ['THSDB', 'COULSDB', 'BATSDB'] and 'RSSI' in m else '' }}
        payload: "ok"
    sensor:
      - name: "ThSdb RSSI"
        unique_id: thsdb_rssi
        device_class: signal_strength
        unit_of_measurement: "dBm"
        state_class: measurement
        icon: mdi:wifi
        state: >-
          {%- set m = trigger.payload.split(' ') | reject('equalto', '') | list -%}
          {%- set i = m.index('RSSI') + 1 -%}
          {%- if i < m | length and m[i] == ':' -%}{%- set i = i + 1 -%}{%- endif -%}
          {%- set v = m[i] | int(0) if i < m | length else 0 -%}
          {{ v if v < 0 else (this.state if this.state | is_number else none) }}

automation:
  # ---------- Réveil automatique de ThSdb à chaque demande d'allumage de la chaudière ----------
  # Demandes vues sur home/chaudiere/command : ON (bouton HA), ON_FORCE (thermostat, programmation, automatisations)
  # et ONR (confirmation du CYD, donc aussi un allumage fait sur l'écran du CYD).
  # L'allumage n'attend pas le réveil (ThSdb lira « SET sleepA:0 » à la fin de son sommeil en cours).
  #  - « Réveiller » déjà en attente                     -> rien
  #  - « Endormir » en attente (SET sleepA:1)            -> annulée, puis « Réveiller » si le deep sleep est actif
  #  - autre commande en attente et ThSdb endormi        -> rien envoyé, notification
  #  - ThSdb en deep sleep (sleepA = 1), rien en attente -> « Réveiller »
  #  - ThSdb éveillé (sleepA = 0), rien en attente       -> rien
  - id: thsdb_reveil_allumage_chaudiere
    alias: ThSdb - Réveil à l'allumage de la chaudière
    description: >-
      Demande le réveil de ThSdb (SET sleepA:0) quand l'allumage de la chaudière est demandé (ON, ON_FORCE ou ONR).
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: mqtt
        topic: "home/chaudiere/command"
    conditions:
      - condition: template
        value_template: "{{ trigger.payload | trim | upper in ['ON', 'ON_FORCE', 'ONR'] }}"
    variables:
      attente: "{{ states('sensor.thsdb_commande_en_attente') | trim }}"
      rien_en_attente: "{{ attente in ['aucune', 'unknown', 'unavailable', ''] }}"
      reveil_en_attente: "{{ attente is match('(?i)^SET\\s+sleepA:0$') }}"
      endormir_en_attente: "{{ attente is match('(?i)^SET\\s+sleepA:1$') }}"
    actions:
      - choose:
          # « Réveiller » déjà en attente : rien à faire
          - conditions:
              - condition: template
                value_template: "{{ reveil_en_attente }}"
            sequence:
              - stop: "Réveil déjà demandé"
          # « Endormir » en attente : l'annuler, puis réveiller si le deep sleep est actif
          - conditions:
              - condition: template
                value_template: "{{ endormir_en_attente }}"
            sequence:
              - action: script.noeud_commande
                data:
                  capteur: thsdb
                  commande: ANNULER
              # Attendre que l'effacement du message retenu soit vu par HA (sinon noeud_commande refuserait)
              - wait_template: "{{ states('sensor.thsdb_commande_en_attente') in ['aucune', 'unknown', 'unavailable', ''] }}"
                timeout: "00:00:15"
                continue_on_timeout: false
              - if:
                  - condition: template
                    value_template: "{{ state_attr('sensor.thsdb_config', 'sleepA') == 1 }}"
                then:
                  - action: script.noeud_commande
                    data:
                      capteur: thsdb
                      commande: "SET sleepA:0"
          # Autre commande en attente et ThSdb endormi : ne rien écraser, prévenir
          - conditions:
              - condition: template
                value_template: "{{ not rien_en_attente and state_attr('sensor.thsdb_config', 'sleepA') == 1 }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "ThSdb non réveillé"
                  message: >-
                    Allumage de la chaudière demandé, mais la commande « {{ attente }} » attend déjà ThSdb :
                    réveil non demandé. Utilisez le bouton « Réveiller ThSdb » une fois cette commande lue (ou annulée).
          # Deep sleep actif, rien en attente : réveiller
          - conditions:
              - condition: template
                value_template: "{{ rien_en_attente and state_attr('sensor.thsdb_config', 'sleepA') == 1 }}"
            sequence:
              - action: script.noeud_commande
                data:
                  capteur: thsdb
                  commande: "SET sleepA:0"

  - id: thsdb_endormissement_automatique
    alias: ThSdb - Endormissement automatique (chaudière et thermostat à l'arrêt)
    description: >-
      Remet ThSdb en deep sleep quand la chaudière est éteinte et le thermostat à l'arrêt depuis le délai réglé.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    variables:
      # Délai en secondes (30 min si le réglage est illisible)
      delai: "{{ (states('input_number.thsdb_delai_sommeil') | float(30)) * 60 }}"
    conditions:
      # Deep sleep inactif sur ThSdb (dernière réponse CONFIG connue)
      - condition: template
        value_template: "{{ state_attr('sensor.thsdb_config', 'sleepA') == 0 }}"
      # Pas de commande déjà en attente (script.noeud_commande la refuserait avec une notification à chaque minute)
      - condition: template
        value_template: "{{ states('sensor.thsdb_commande_en_attente') in ['aucune', 'unknown', 'unavailable', ''] }}"
      # DEL de la chaudière éteinte depuis le délai
      - condition: template
        value_template: >-
          {{ is_state('sensor.coulsdb_del', 'Eteinte')
             and (now() - states.sensor.coulsdb_del.last_changed).total_seconds() >= delai }}
      # Thermostat à l'arrêt depuis le délai
      - condition: template
        value_template: >-
          {{ is_state('climate.chaudiere_rdc', 'off')
             and (now() - states.climate.chaudiere_rdc.last_changed).total_seconds() >= delai }}
      # Dernière réponse CONFIG (réveil demandé...) plus ancienne que le délai
      - condition: template
        value_template: >-
          {%- set s = states('sensor.thsdb_config') -%}
          {%- set t = as_datetime(s) if s not in ['unknown', 'unavailable', ''] else none -%}
          {{ t is none or (now() - t).total_seconds() >= delai }}
    actions:
      - action: script.noeud_commande
        data:
          capteur: thsdb
          commande: "SET sleepA:1"
