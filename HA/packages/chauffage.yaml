# ============================================================
# Package : Chauffage SDB
#  - switch.chauffage_sdb_programme :
#      ON  = enable ON  -> 2 s -> chauffage ON
#      OFF = chauffage OFF -> 2 s -> enable OFF
#  - Présence, RSSI et IP du C3 (NoeudChauffageSb)
#    à partir de ses ALIVE publiés sur home/noeud/state
#    Trame : NoeudChauffageSb ALIVE 09/10/2026 14:32:05 RSSI -67 192.168.1.42
# ============================================================

template:
  # ---------- Switch programmé (utilisé par le scheduler) ----------
  - switch:
      - name: "Chauffage SDB programmé"
        unique_id: chauffage_programme_sdb
        icon: mdi:radiator
        state: "{{ is_state('switch.chauffage', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target:
              entity_id: switch.chauffage_enable
          - delay:
              seconds: 2
          - action: switch.turn_on
            target:
              entity_id: switch.chauffage
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.chauffage
          - delay:
              seconds: 2
          - action: switch.turn_off
            target:
              entity_id: switch.chauffage_enable

  # ---------- Présence + RSSI + IP du C3 (seulement ses ALIVE) ----------
  - trigger:
      - trigger: mqtt
        topic: "home/noeud/state"
        value_template: "{{ value.split(' ')[:2] | join(' ') | upper }}"
        payload: "NOEUDCHAUFFAGESB ALIVE"
    binary_sensor:
      - name: "C3 chauffage SdB"
        unique_id: c3_chauffage_sdb_connectivite
        device_class: connectivity
        state: "on"
        auto_off: "00:01:00"
    sensor:
      - name: "C3 chauffage SdB RSSI"
        unique_id: c3_chauffage_sdb_rssi
        device_class: signal_strength
        unit_of_measurement: "dBm"
        state_class: measurement
        state: >-
          {% set m = trigger.payload.split(' ') %}
          {% if 'RSSI' in m and m | length > m.index('RSSI') + 1 %}
            {{ m[m.index('RSSI') + 1] | int(0) }}
          {% else %}
            {{ none }}
          {% endif %}
      - name: "C3 chauffage SdB IP"
        unique_id: c3_chauffage_sdb_ip
        icon: mdi:ip-network
        state: >-
          {% set ip = trigger.payload.split(' ')[-1] %}
          {{ ip if ip is match('^\d{1,3}(\.\d{1,3}){3}$') else this.state }}
