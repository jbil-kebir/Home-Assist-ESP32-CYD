; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[env:seeed_xiao_esp32c3]
;platform = espressif32
;board = seeed_xiao_esp32c3

; ──────────────────────────────────────────────────────────────
; Configuration commune à toutes les cibles
; ──────────────────────────────────────────────────────────────
[common]
platform = espressif32@6.9.0     ; Arduino 2.x / IDF 4.4 : le code (MyConfig.cpp : adc_power_*, RTC_PERIPH) ne compile pas en IDF 5 (pioarduino)
framework = arduino
monitor_speed = 115200
monitor_reconnect = yes
upload_speed = 921600
; version_build.py : date et heure de compilation toujours à jour (MyVersion.cpp) ; ota_auth.py : téléversement par le
; réseau dès que le port est une adresse IP (pio run -e <profil> -t upload --upload-port <IP>), voir ce fichier
extra_scripts =
    pre:version_build.py
    post:ota_auth.py
lib_deps = 
    knolleary/PubSubClient@^2.8 ; MQTT
    milesburton/DallasTemperature@^3.11.0
    https://github.com/RobTillaart/DHT20.git
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
    sui77/rc-switch@^2.6.3
    jgromes/RadioLib@7.6.0 ; version fixée : la 8.0 (dépôt GitHub sans version) change l API, SX1262::begin et setPacketSentAction ne compilent plus (15/11/2026)
    adafruit/Adafruit TCS34725 @ ^1.0.0
    adafruit/Adafruit BusIO @ ^1.16.0
    kosme/arduinoFFT@^2.0 ; Micro MAX4466 (détection des bips)
    arminjo/IRremote@^4.4.1 ; Actionneur IR (chauffage SdB)
build_flags = 
    ;-D DEBUG
    -D ETIQUETTE_FIRMWARE=\"${PIOENV}\"   ; Étiquette du firmware = nom du profil (MyOta : /update refuse un autre profil ; suffixe _ota ignoré)

; ──────────────────────────────────────────────────────────────
; Profils de compilation : choisir le profil dans la barre d'état de VS Code (« env:… »), jamais « Default (all) »
; (tous les profils seraient compilés).
;
; Profils PAR NŒUD (PRODUCTION) : carte, liaison et capteurs fixés ici (-D PROFIL_NOEUD), rien à modifier dans global.h.
; Nom, IP, réglages : en NVS (page Web), pas dans le firmware.
;   ThChRDC_Xiao_C3            Wi-Fi, DHT20 + batterie
;   ThCh1er_Xiao_C3            Wi-Fi, DHT20 + batterie
;   ThSdb_Xiao_C3              Wi-Fi, DHT20 + capteur couleur TCS34725 (et sa DEL) + batterie (capteur chaudière)
;   PrGuirlande_Xiao_C3        Wi-Fi, présence sur le réseau électrique (derrière la prise RF de la guirlande)
;   PrChauffageRDC_Xiao_C3     Wi-Fi, présence sur le réseau électrique (derrière la prise RF du chauffage RdC)
;   NoeudChauffageSdb_Xiao_C3  Wi-Fi, micro MAX4466 + actionneur IR (chauffage SdB)
;   ThRemise_Xiao_S3           LoRa, DHT20 + batterie + flotteur
;   ThCave_Xiao_S3             LoRa, DHT20 + batterie + détecteur jour / nuit
;
; Profils GÉNÉRIQUES : liaison et capteurs pris dans global.h (bloc #ifndef PROFIL_NOEUD) : essais, nouveau nœud, debug.
;   xiao_c3        XIAO ESP32-C3, PRODUCTION (pas de port série USB : économie d'énergie)
;   xiao_c3_debug  XIAO ESP32-C3, DEBUG (port série USB pour le moniteur)
;   xiao_s3        XIAO ESP32-S3 (+ Wio-SX1262), PRODUCTION
;   xiao_s3_debug  XIAO ESP32-S3 (+ Wio-SX1262), DEBUG
; La carte ESP32-C3 Super Mini est abandonnée (profil esp32c3 supprimé le 31/10/2026).
; ──────────────────────────────────────────────────────────────
[usb_production]
build_flags =
    -D ARDUINO_USB_MODE=0         ; Production : désactive le mode USB pour économiser de l'énergie (pas de port série, pas de périphérique USB)
    -D ARDUINO_USB_CDC_ON_BOOT=0  ; Production : désactive le port série USB pour économiser de l'énergie

[usb_debug]
build_flags =
    -D ARDUINO_USB_MODE=1         ; Debug : active le mode USB pour avoir un port série dès le démarrage
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; Debug : active le port série USB dès le démarrage pour voir les logs de démarrage

; ──────────────────────────────────────────────────────────────
; XIAO ESP32-C3 (carte « Capteur C3 Xiao » : brochage dans global.h, bloc BOARD_XIAO_C3)
; ──────────────────────────────────────────────────────────────
[c3]
extends = common
board = seeed_xiao_esp32c3
; Flash 4 Mo (Capteur 4.5) : deux emplacements de programme de 1,9 Mo (au lieu de 1,25 Mo) pour la mise à jour à
; distance ; zone de fichiers 128 Ko (inutilisée), NVS au même endroit. Changer de découpage demande un flash par USB.
; (S3 : flash 8 Mo, default_8MB.csv, deux emplacements de 3,2 Mo : rien à changer)
board_build.partitions = min_spiffs.csv
c3_flags =
    -D __ESP32_C3__
    -D BOARD_ESP32_C3
    -D BOARD_XIAO_C3

[env:xiao_c3]
extends = c3
; La carte seeed_xiao_esp32c3 impose elle-même ARDUINO_USB_MODE=1 et ARDUINO_USB_CDC_ON_BOOT=1 : on les retire
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${common.build_flags}
    ${usb_production.build_flags}
    ${c3.c3_flags}

[env:xiao_c3_debug]
extends = c3
; Pas de build_unflags : les ARDUINO_USB_* = 1 imposés par la carte donnent le port série USB
build_flags =
    ${common.build_flags}
    ${c3.c3_flags}

; ──────────────────────────────────────────────────────────────
; XIAO ESP32-S3 (+ Wio-SX1262)
; ──────────────────────────────────────────────────────────────
[s3]
extends = common
board = esp32-s3-devkitc-1          ; carte de tous les S3 en service (xiao_esp32s3 changerait le découpage de la flash)
; monitor_rts = 0
monitor_dtr = 0
build_unflags =
    -DARDUINO_USB_MODE
    -DARDUINO_USB_CDC_ON_BOOT
s3_flags =
    -D __ESP32_S3__
    -D BOARD_ESP32_S3

[env:xiao_s3]
extends = s3
build_flags =
    ${common.build_flags}
    ${usb_production.build_flags}
    ${s3.s3_flags}

[env:xiao_s3_debug]
extends = s3
build_flags =
    ${common.build_flags}
    ${usb_debug.build_flags}
    ${s3.s3_flags}

; ══════════════════════════════════════════════════════════════
; Profils par nœud (PRODUCTION)
; ══════════════════════════════════════════════════════════════
; XIAO ESP32-C3, Wi-Fi
[c3_noeud]
extends = c3
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${common.build_flags}
    ${usb_production.build_flags}
    ${c3.c3_flags}
    -D PROFIL_NOEUD
    -D _WIFI_MODE_

[env:ThChRDC_Xiao_C3]
extends = c3_noeud
build_flags =
    ${c3_noeud.build_flags}
    -D CAPTEUR_DHT20
    -D CAPTEUR_BATTERIE

[env:ThCh1er_Xiao_C3]
extends = c3_noeud
build_flags =
    ${c3_noeud.build_flags}
    -D CAPTEUR_DHT20
    -D CAPTEUR_BATTERIE

[env:ThSdb_Xiao_C3]
extends = c3_noeud
build_flags =
    ${c3_noeud.build_flags}
    -D CAPTEUR_DHT20
    -D CAPTEUR_RGB_TCS34725
    -D LED_CAPTEUR_RGB
    -D CAPTEUR_BATTERIE

[env:PrGuirlande_Xiao_C3]
extends = c3_noeud
build_flags =
    ${c3_noeud.build_flags}
    -D CAPTEUR_PRESENCE_RESEAU

; Même firmware que PrGuirlande (le nom PrChauffageRDC est en NVS, page Web)
[env:PrChauffageRDC_Xiao_C3]
extends = c3_noeud
build_flags =
    ${c3_noeud.build_flags}
    -D CAPTEUR_PRESENCE_RESEAU

[env:NoeudChauffageSdb_Xiao_C3]
extends = c3_noeud
build_flags =
    ${c3_noeud.build_flags}
    -D CAPTEUR_MICRO_MAX4466
    -D ACTIONNEUR_IR

; XIAO ESP32-S3 + Wio-SX1262, LoRa seul
[s3_noeud]
extends = s3
build_flags =
    ${common.build_flags}
    ${usb_production.build_flags}
    ${s3.s3_flags}
    -D PROFIL_NOEUD
    -D _LORA_P2P_MODE_

[env:ThRemise_Xiao_S3]
extends = s3_noeud
build_flags =
    ${s3_noeud.build_flags}
    -D OTA_IP_FIXE=\"192.168.1.240\"   ; Adresse sur le Wi-Fi de la maison pendant une mise à jour (commande OTA)
    -D CAPTEUR_DHT20
    -D CAPTEUR_BATTERIE
    -D FLOTTEUR_VERTICAL

[env:ThCave_Xiao_S3]
extends = s3_noeud
build_flags =
    ${s3_noeud.build_flags}
    -D OTA_IP_FIXE=\"192.168.1.241\"   ; Adresse sur le Wi-Fi de la maison pendant une mise à jour (commande OTA)
    -D CAPTEUR_DHT20
    -D CAPTEUR_BATTERIE
    -D CAPTEUR_JOUR_NUIT

; ──────────────────────────────────────────────────────────────
; Mise à jour par le réseau des nœuds LoRa (Capteur 4.6) : poser le répéteur Wi-Fi près du nœud, envoyer la commande OTA
; depuis HA (commande libre), attendre « prêt … sur le Wi-Fi de la maison » dans HA, puis « Upload » avec ce profil.
; Même firmware que le profil USB ; ota_auth.py bascule sur espota (upload_port = adresse IP).
[env:ThRemise_Xiao_S3_ota]
extends = env:ThRemise_Xiao_S3
upload_port = 192.168.1.240

[env:ThCave_Xiao_S3_ota]
extends = env:ThCave_Xiao_S3
upload_port = 192.168.1.241

; Nœud Wi-Fi : éveillé (sleepA:0) ou commande OTA depuis HA (10 min d'éveil), puis « Upload » avec ce profil.
[env:ThChRDC_Xiao_C3_ota]
extends = env:ThChRDC_Xiao_C3
upload_port = 192.168.1.57

[env:ThCh1er_Xiao_C3_ota]
extends = env:ThCh1er_Xiao_C3
upload_port = 192.168.1.161

[env:ThSdb_Xiao_C3_ota]
extends = env:ThSdb_Xiao_C3
upload_port = 192.168.1.128

[env:PrGuirlande_Xiao_C3_ota]
extends = env:PrGuirlande_Xiao_C3
upload_port = 192.168.1.114

[env:PrChauffageRDC_Xiao_C3_ota]
extends = env:PrChauffageRDC_Xiao_C3
upload_port = 192.168.1.67

[env:NoeudChauffageSdb_Xiao_C3_ota]
extends = env:NoeudChauffageSdb_Xiao_C3
upload_port = 192.168.1.84
