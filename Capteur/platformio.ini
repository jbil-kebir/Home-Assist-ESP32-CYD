; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[env:seeed_xiao_esp32c3]
;platform = espressif32
;board = seeed_xiao_esp32c3

; ──────────────────────────────────────────────────────────────
; Configuration commune à toutes les cibles
; ──────────────────────────────────────────────────────────────
[common]
platform = espressif32@6.9.0     ; Arduino 2.x / IDF 4.4 : le code (MyConfig.cpp : adc_power_*, RTC_PERIPH) ne compile pas en IDF 5 (pioarduino)
framework = arduino
monitor_speed = 115200
monitor_reconnect = yes
upload_speed = 921600
extra_scripts = pre:version_build.py ; Date et heure de compilation toujours à jour (MyVersion.cpp)
lib_deps = 
    knolleary/PubSubClient@^2.8 ; MQTT
    milesburton/DallasTemperature@^3.11.0
    https://github.com/RobTillaart/DHT20.git
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
    sui77/rc-switch@^2.6.3
    https://github.com/jgromes/RadioLib
    adafruit/Adafruit TCS34725 @ ^1.0.0
    adafruit/Adafruit BusIO @ ^1.16.0
    kosme/arduinoFFT@^2.0 ; Micro MAX4466 (détection des bips)
    arminjo/IRremote@^4.4.1 ; Actionneur IR (chauffage SdB)
build_flags = 
    ;-D DEBUG

; ──────────────────────────────────────────────────────────────
; Profils de compilation : choisir le profil dans la barre d'état de VS Code (« env:… »), jamais « Default (all) »
; (les deux cartes seraient compilées, et celle qui ne correspond pas à global.h s'arrêterait sur ses #error).
; Seul global.h est ensuite à modifier (capteurs, Wi-Fi / LoRa).
;   xiao_c3        XIAO ESP32-C3, PRODUCTION (pas de port série USB : économie d'énergie)
;   xiao_c3_debug  XIAO ESP32-C3, DEBUG (port série USB pour le moniteur)
;   xiao_s3        XIAO ESP32-S3 (+ Wio-SX1262), PRODUCTION
;   xiao_s3_debug  XIAO ESP32-S3 (+ Wio-SX1262), DEBUG
; La carte ESP32-C3 Super Mini est abandonnée (profil esp32c3 supprimé le 31/10/2026).
; ──────────────────────────────────────────────────────────────
[usb_production]
build_flags =
    -D ARDUINO_USB_MODE=0         ; Production : désactive le mode USB pour économiser de l'énergie (pas de port série, pas de périphérique USB)
    -D ARDUINO_USB_CDC_ON_BOOT=0  ; Production : désactive le port série USB pour économiser de l'énergie

[usb_debug]
build_flags =
    -D ARDUINO_USB_MODE=1         ; Debug : active le mode USB pour avoir un port série dès le démarrage
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; Debug : active le port série USB dès le démarrage pour voir les logs de démarrage

; ──────────────────────────────────────────────────────────────
; XIAO ESP32-C3 (carte « Capteur C3 Xiao » : brochage dans global.h, bloc BOARD_XIAO_C3)
; ──────────────────────────────────────────────────────────────
[c3]
extends = common
board = seeed_xiao_esp32c3
c3_flags =
    -D __ESP32_C3__
    -D BOARD_ESP32_C3
    -D BOARD_XIAO_C3

[env:xiao_c3]
extends = c3
; La carte seeed_xiao_esp32c3 impose elle-même ARDUINO_USB_MODE=1 et ARDUINO_USB_CDC_ON_BOOT=1 : on les retire
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${common.build_flags}
    ${usb_production.build_flags}
    ${c3.c3_flags}

[env:xiao_c3_debug]
extends = c3
; Pas de build_unflags : les ARDUINO_USB_* = 1 imposés par la carte donnent le port série USB
build_flags =
    ${common.build_flags}
    ${c3.c3_flags}

; ──────────────────────────────────────────────────────────────
; XIAO ESP32-S3 (+ Wio-SX1262)
; ──────────────────────────────────────────────────────────────
[s3]
extends = common
board = esp32-s3-devkitc-1          ; carte de tous les S3 en service (xiao_esp32s3 changerait le découpage de la flash)
monitor_rts = 0
monitor_dtr = 0
build_unflags =
    -DARDUINO_USB_MODE
    -DARDUINO_USB_CDC_ON_BOOT
s3_flags =
    -D __ESP32_S3__
    -D BOARD_ESP32_S3

[env:xiao_s3]
extends = s3
build_flags =
    ${common.build_flags}
    ${usb_production.build_flags}
    ${s3.s3_flags}

[env:xiao_s3_debug]
extends = s3
build_flags =
    ${common.build_flags}
    ${usb_debug.build_flags}
    ${s3.s3_flags}
