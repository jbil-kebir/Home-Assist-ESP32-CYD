; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[env:seeed_xiao_esp32c3]
;platform = espressif32
;board = seeed_xiao_esp32c3

; ──────────────────────────────────────────────────────────────
; Configuration commune à toutes les cibles
; ──────────────────────────────────────────────────────────────
[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_reconnect = yes
upload_speed = 921600
lib_deps = 
    knolleary/PubSubClient@^2.8 ; MQTT
    milesburton/DallasTemperature@^3.11.0
    https://github.com/RobTillaart/DHT20.git
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
    sui77/rc-switch@^2.6.3
    https://github.com/jgromes/RadioLib
    adafruit/Adafruit TCS34725 @ ^1.0.0
    adafruit/Adafruit BusIO @ ^1.16.0
build_flags = 
    ;-D DEBUG
; Deux lignes à commenter/décommmenter pour avoir le moniteur série pour les affichages
;============================ DEBUG ============================================================
	;-D ARDUINO_USB_MODE=1 ; Debug : active le mode USB pour avoir un port série et un périphérique USB (ex: clavier, souris, etc.) dès le démarrage            
	;-D ARDUINO_USB_CDC_ON_BOOT=1 ; Debug : active le port série USB dès le démarrage pour voir les logs de démarrage     
;============================ PRODUCTION =======================================================
	;-D ARDUINO_USB_MODE=0 ; Production : désactive le mode USB pour économiser de l'énergie (pas de port série, pas de périphérique USB)            
	;-D ARDUINO_USB_CDC_ON_BOOT=0  ; Production : désactive le port série USB pour économiser de l'énergie 

; ──────────────────────────────────────────────────────────────
; ESP32-C3 Super Mini
; ──────────────────────────────────────────────────────────────
;[env:esp32c3]
;extends = common
;board = esp32-c3-devkitm-1          ; ou esp32-c3-super-mini si tu as un board custom
;build_flags = 
;    ${common.build_flags}
;    -D __ESP32_C3__

;    -D BOARD_ESP32_C3
; ──────────────────────────────────────────────────────────────
; ESP32-S3 (XIAO ESP32S3, Super Mini S3, etc.)
; ──────────────────────────────────────────────────────────────
[env:esp32s3]
extends = common
board = esp32-s3-devkitc-1          ; ou xiao_esp32s3 pour le Seeed XIAO
monitor_rts = 0
monitor_dtr = 0
build_unflags =
    -DARDUINO_USB_MODE
    -DARDUINO_USB_CDC_ON_BOOT
build_flags =
    ${common.build_flags}
    -D __ESP32_S3__
    -D BOARD_ESP32_S3
;============================ DEBUG ============================================================
;	-D ARDUINO_USB_MODE=1 ; Debug : active le mode USB pour avoir un port série et un périphérique USB (ex: clavier, souris, etc.) dès le démarrage            
;	-D ARDUINO_USB_CDC_ON_BOOT=1 ; Debug : active le port série USB dès le démarrage pour voir les logs de démarrage     
;============================ PRODUCTION =======================================================
	;-D ARDUINO_USB_MODE=0 ; Production : désactive le mode USB pour économiser de l'énergie (pas de port série, pas de périphérique USB)            
	;-D ARDUINO_USB_CDC_ON_BOOT=0  ; Production : désactive le port série USB pour économiser de l'énergie 
